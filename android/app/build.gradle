plugins { id 'com.android.application' }

android {
    namespace 'com.nicassistant'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'com.nicassistant'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        buildConfigField 'String', 'DEFAULT_SERVER_URL', '"https://YOUR-NIC-SERVER.example"'
    }
}
