<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NIC • Neural Intelligence Core</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif}body{margin:0;background:#070a0f;color:#eef2f7}main{max-width:1200px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center}.brand h1{margin:0;font-size:30px}.muted{color:#8994a3}.pill{border:1px solid #26303d;border-radius:999px;padding:8px 12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0}.card{background:#0d121a;border:1px solid #1c2633;border-radius:16px;padding:18px}.big{font-size:26px;font-weight:700;margin-top:8px}.wide{grid-column:span 2}.activity{max-height:430px;overflow:auto}.event{padding:12px 0;border-bottom:1px solid #1a222d}.stage{font-size:12px;text-transform:uppercase;color:#7dd3fc}.ok{color:#67e8a5}.warn{color:#fbbf24}.bar{height:8px;background:#1b2430;border-radius:9px;overflow:hidden}.fill{height:100%;background:#67e8a5;width:0}.footer{margin-top:24px;color:#657181;font-size:12px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.wide{grid-column:span 2}}@media(max-width:520px){.grid{grid-template-columns:1fr}.wide{grid-column:span 1}}

.chat-shell{display:grid;grid-template-columns:minmax(0,2fr) minmax(270px,1fr);gap:14px;margin:18px 0}.chat-panel{background:#0d121a;border:1px solid #26303d;border-radius:16px;padding:16px;min-width:0}.chat-log{height:380px;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:8px 0}.bubble{max-width:92%;padding:12px 14px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}.bubble.user{align-self:flex-end;background:#173b55}.bubble.assistant{align-self:flex-start;background:#171f2b;border:1px solid #26303d}.chat-compose{display:flex;gap:8px;margin-top:8px}.chat-compose textarea{flex:1;min-width:0;resize:vertical;min-height:60px}input,textarea,button{font:inherit;color:#eef2f7;background:#080d14;border:1px solid #303d4d;border-radius:10px;padding:10px}button{cursor:pointer}button.primary{background:#14532d;border-color:#166534}button.danger{background:#7f1d1d;border-color:#991b1b}button:disabled{opacity:.45;cursor:not-allowed}.formrow{display:grid;gap:6px;margin:10px 0}.formrow label,.small{font-size:12px;color:#9aa7b7}.control-status{padding:10px;border-radius:10px;background:#111925;margin:10px 0;line-height:1.5}.approval{border:1px solid #303d4d;border-radius:12px;padding:12px;margin:10px 0;overflow-wrap:anywhere}.approval pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#070a0f;padding:8px;border-radius:8px;font-size:12px}.pluginrow{padding:9px 0;border-bottom:1px solid #202b38;display:flex;justify-content:space-between;gap:10px}@media(max-width:850px){.chat-shell{grid-template-columns:1fr}.chat-log{height:300px}}

</head>
<body><main>
<div class="top"><div class="brand"><div class="muted">AUTONOMOUS CRYPTO INTELLIGENCE</div><h1>NIC Command Center</h1></div><div id="status" class="pill">Connecting…</div></div>
<nav style="display:flex;gap:8px;flex-wrap:wrap;margin:18px 0"><a class="pill" href="#overview">Overview</a><a class="pill" href="#activity">Activity</a><a class="pill" href="#reasoning">Reasoning</a><a class="pill" href="#learning">Learning</a><a class="pill" href="#brain">Brain Map</a><a class="pill" href="#assistant">Chat & Controls</a></nav>
<div id="overview" class="grid">
<div class="card"><div class="muted">NIC VERSION</div><div id="version" class="big">—</div></div>
<div class="card"><div class="muted">SYMBOL</div><div id="symbol" class="big">—</div></div>
<div class="card"><div class="muted">DIRECTION</div><div id="direction" class="big">—</div></div>
<div class="card"><div class="muted">EVIDENCE</div><div id="evidence" class="big">—</div><div class="bar"><div id="fill" class="fill"></div></div></div>
<div id="reasoning" class="card wide"><div class="muted">CURRENT THESIS</div><p id="thesis">Waiting for NIC state…</p><div class="mono" id="meta">—</div></div>
<div id="brain" class="card wide"><div class="muted">NIC BRAIN MAP</div><div id="brainMap" style="display:grid;gap:8px;margin-top:10px">Market Scan → Signal Router → Evidence → Adversarial → Decision → Publish → Outcome → Learning</div><div class="mono" id="brainMeta">Loading pipeline state…</div></div>
<div class="card wide"><div class="muted">AGENT MESH</div><div id="agents" style="display:grid;gap:8px;margin-top:10px"></div><div class="mono" id="meshMeta">Loading mesh…</div></div>
<div class="card wide"><div class="muted">SYSTEM SIGNALS</div><div id="signals" style="display:grid;gap:6px;margin-top:10px"></div></div>
<div id="learning" class="card wide"><div class="muted">NIC LEARNING STATE</div><p id="learningText">Reading outcome memory…</p><div class="mono" id="learningMeta">—</div></div>
<div class="card wide"><div class="muted">LIVE ACTIVITY</div><div id="activity" class="activity">Waiting for events…</div></div>
</div>

<section id="assistant" class="chat-shell">
 <div class="chat-panel"><div class="muted">NIC ASSISTANT</div><h2 style="margin:8px 0">Talk to NIC</h2>
 <div class="small">Chat history stays in this page session. This calls your separately deployed NIC chat API; it does not connect this static page to the ChatGPT app itself.</div>
 <div id="chatLog" class="chat-log" aria-live="polite"><div class="bubble assistant">Hi. I’m NIC’s creator-workflow assistant. I can help with Binance Square research, drafts, originality, and reward-learning evidence. External tools are not connected through this chat yet.</div></div>
 <form id="chatForm"><div class="chat-compose"><textarea id="chatMessage" maxlength="12000" placeholder="Ask NIC to research, review a post, or explain its learning…" required></textarea><button class="primary" id="sendChat" type="submit">Send</button></div></form><div id="chatError" class="small" role="status"></div></div>
 <aside class="chat-panel"><div class="muted">OWNER CONTROL CONSOLE</div><h2 style="margin:8px 0">Permissions & STOP</h2>
 <div class="small">Enter the API address and owner token for this session only. Tokens are held in page memory, never localStorage. Use HTTPS for remote access.</div>
 <div class="formrow"><label for="apiBase">NIC API base URL</label><input id="apiBase" type="url" placeholder="https://your-private-nic-api.example" autocomplete="off"></div>
 <div class="formrow"><label for="chatToken">Chat access token</label><input id="chatToken" type="password" placeholder="NIC_CHAT_ACCESS_TOKEN" autocomplete="off"></div>
 <div class="formrow"><label for="ownerToken">Owner control token</label><input id="ownerToken" type="password" placeholder="NIC_OWNER_CONTROL_TOKEN" autocomplete="off"></div>
 <button id="connectApi" type="button">Connect for this session</button><div id="controlStatus" class="control-status">Not connected. No control action has been sent.</div>
 <div style="display:flex;gap:8px;flex-wrap:wrap"><button id="stopNic" class="danger" type="button" disabled>STOP NIC actions</button><button id="resumeNic" type="button" disabled>Resume actions</button><button id="refreshApprovals" type="button" disabled>Refresh approvals</button></div>
 <h3>Pending / recent approvals</h3><div id="approvalList" class="small">Connect the owner API to inspect approval requests.</div><h3>Tools & plugins</h3>
 <div class="pluginrow"><span>NIC chat API</span><span id="chatPluginState" class="warn">Not connected</span></div><div class="pluginrow"><span>Owner control API</span><span id="controlPluginState" class="warn">Not connected</span></div><div class="pluginrow"><span>Binance Square publishing executor</span><span class="warn">Not connected to this gate</span></div><div class="pluginrow"><span>Other plugins</span><span class="warn">None confirmed</span></div>
 <p class="small">Safety disclosure: this interface can call the control API, but the current repository state reports that every NIC executor is not yet wired through the gate. Do not rely on this button as a universal kill switch until that integration is completed and verified.</p></aside>
</section>
<div class="footer">Auto-refreshes every 20 seconds • Real repository telemetry only • NIC Core is primary • External models are optional advisors</div>
</main>
<script>
const base='https://raw.githubusercontent.com/Rakesh3136/binance-square-ai-creator/main/';
const $=id=>document.getElementById(id);
async function get(path){const r=await fetch(base+path+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);return r.json()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function refresh(){
 try{
  const s=await get('data/live/nic_dashboard.json').catch(()=>get('data/live/nic_core_state.json'));
  const n=s.nic||s;
  $('version').textContent=n.version||n.nic_version||'—';
  $('symbol').textContent=n.symbol?'$'+String(n.symbol).replace(/^\$/,''):'—';
  $('direction').textContent=n.direction||'—';
  const e=Number(n.evidence_score||0); $('evidence').textContent=e+'%'; $('fill').style.width=Math.max(0,Math.min(100,e))+'%';
  $('thesis').textContent=n.thesis||n.editorial_thesis||'—';
  $('meta').textContent='thesis '+(n.thesis_id||'—')+' • hook '+(n.hook_family||'—')+' • '+(s.generated_at||'—');
  if(s.mesh){$('meshMeta').textContent=(s.mesh.logical_agents||0)+' logical agents • '+(s.mesh.active_agents||0)+' active • validation '+(s.mesh.validation?.status||'—');$('agents').innerHTML=(s.agents||[]).map(a=>'<div class="card" style="padding:10px"><b>'+esc(a.module)+'</b> <span class="mono">'+esc(a.decision)+'</span><br><span class="muted">'+esc(a.reason||'No reason recorded')+'</span></div>').join('')||'No specialist artifacts available';}
  $('signals').innerHTML='';
  const checks=[['NIC state','data/live/nic_core_state.json'],['Activity stream','data/live/nic_activity.jsonl'],['Signal router','data/live/signal_first_routing.json'],['Market regime','data/live/market_regime.json'],['Creator decision','data/live/creator_brain_decision.json'],['Prediction outcomes','data/live/creator_24_1_prediction_outcomes.json']];
  for(const [label,path] of checks){try{await get(path);$('signals').insertAdjacentHTML('beforeend','<div>● '+esc(label)+' <span class="muted">AVAILABLE</span></div>')}catch(_){$('signals').insertAdjacentHTML('beforeend','<div>○ '+esc(label)+' <span class="muted">NOT AVAILABLE</span></div>')}}
  $('brainMeta').textContent='Pipeline telemetry is read from committed artifacts; no simulated agent status.';
  try{const l=await get('data/live/creator_7_2_learning.json');$('learningText').textContent=JSON.stringify(l.strategy_recommendations||l.recommendations||l.summary||'Learning state available');$('learningMeta').textContent='learning artifact loaded • '+new Date().toISOString()}catch(_){$('learningText').textContent='No learning artifact available yet';$('learningMeta').textContent='NIC continues operating without it'}
  const r=await fetch(base+'data/live/nic_activity.jsonl?t='+Date.now(),{cache:'no-store'});
  if(r.ok){const txt=await r.text();const rows=txt.trim().split('\n').filter(Boolean).slice(-40).reverse().map(x=>{try{return JSON.parse(x)}catch(_){return null}}).filter(Boolean);$('activity').innerHTML=rows.map(x=>'<div class="event"><span class="stage">'+esc(x.stage)+'</span> <b>'+esc(x.event)+'</b><br><span class="muted">'+esc(x.timestamp)+'</span></div>').join('')||'No activity yet';}
  $('status').textContent='● NIC ONLINE';$('status').className='pill ok';
 }catch(e){$('status').textContent='● WAITING FOR TELEMETRY';$('status').className='pill warn';$('meta').textContent='Telemetry fetch failed: '+String(e.message||e);}
}

let nicApiBase='',nicChatToken='',nicOwnerToken='';const nicChatHistory=[];
function chatBubble(role,text){const el=document.createElement('div');el.className='bubble '+role;el.textContent=text;$('chatLog').appendChild(el);$('chatLog').scrollTop=$('chatLog').scrollHeight;}
function apiHeaders(token){return {'Authorization':'Bearer '+token,'Content-Type':'application/json','Accept':'application/json'};}
async function apiCall(path,token,body){const r=await fetch(nicApiBase+path,{method:body===undefined?'GET':'POST',headers:apiHeaders(token),body:body===undefined?undefined:JSON.stringify(body),cache:'no-store'});let d={};try{d=await r.json()}catch(_){}if(!r.ok)throw Error(d.error||('HTTP '+r.status));return d;}
$('connectApi').addEventListener('click',async()=>{nicApiBase=$('apiBase').value.trim().replace(/\/$/,'');nicChatToken=$('chatToken').value;nicOwnerToken=$('ownerToken').value;if(!nicApiBase){$('controlStatus').textContent='Enter the private NIC API base URL first.';return;}try{const r=await fetch(nicApiBase+'/healthz',{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error('Health check failed');$('controlStatus').textContent='API reachable. Model configured: '+Boolean(d.model_configured)+'. Plugins confirmed: '+(d.connected_plugins||[]).length+'. External action execution: '+(d.external_action_execution||'unknown')+'.';$('chatPluginState').textContent=nicChatToken?'Token supplied; test chat to verify':'Token needed';if(nicOwnerToken){await loadControlStatus();$('controlPluginState').textContent='Connected';$('stopNic').disabled=false;$('resumeNic').disabled=false;$('refreshApprovals').disabled=false;}else $('controlPluginState').textContent='Owner token needed';}catch(e){$('controlStatus').textContent='Could not connect: '+e.message;$('chatPluginState').textContent='Unavailable';$('controlPluginState').textContent='Unavailable';}});
$('chatForm').addEventListener('submit',async ev=>{ev.preventDefault();const message=$('chatMessage').value.trim();if(!message)return;if(!nicApiBase||!nicChatToken){$('chatError').textContent='Connect the API and supply the chat token first.';return;}$('chatMessage').value='';chatBubble('user',message);$('sendChat').disabled=true;$('chatError').textContent='NIC is thinking…';try{const d=await apiCall('/chat',nicChatToken,{message,history:nicChatHistory});chatBubble('assistant',d.reply);nicChatHistory.push({role:'user',content:message},{role:'assistant',content:d.reply});while(nicChatHistory.length>12)nicChatHistory.shift();$('chatError').textContent='Reply received from '+(d.model||'NIC assistant')+'.';$('chatPluginState').textContent='Connected';}catch(e){$('chatError').textContent='Chat failed: '+e.message;}finally{$('sendChat').disabled=false;}});
async function loadControlStatus(){const s=await apiCall('/control/status',nicOwnerToken);$('controlStatus').textContent='Emergency stop: '+(s.emergency_stop?'ACTIVE':'off')+' • pending approvals: '+s.pending_approvals+' • approved awaiting execution: '+s.approved_not_consumed+' • audit events: '+s.audit_events+'. '+(s.warning||'');$('stopNic').disabled=Boolean(s.emergency_stop);$('resumeNic').disabled=!s.emergency_stop;await loadApprovals();}
async function loadApprovals(){const d=await apiCall('/control/approvals',nicOwnerToken);const host=$('approvalList');host.textContent='';if(!d.requests||!d.requests.length){host.textContent='No approval requests recorded.';return;}for(const item of d.requests.slice(0,30)){const card=document.createElement('div');card.className='approval';const title=document.createElement('b');title.textContent=item.action+' • '+item.status;card.appendChild(title);const meta=document.createElement('p');meta.textContent='Capability: '+item.capability+' | Expires: '+item.expires_at;card.appendChild(meta);const details=document.createElement('pre');details.textContent=JSON.stringify(item.details,null,2);card.appendChild(details);if(item.status==='pending'){for(const decision of ['approve','deny']){const b=document.createElement('button');b.textContent=decision==='approve'?'Approve once':'Deny';b.style.marginRight='8px';b.addEventListener('click',async()=>{b.disabled=true;try{await apiCall('/control/approvals/'+encodeURIComponent(item.request_id)+'/'+decision,nicOwnerToken,{});await loadControlStatus();}catch(e){$('controlStatus').textContent='Approval action failed: '+e.message;b.disabled=false;}});card.appendChild(b);}}host.appendChild(card);}}
$('stopNic').addEventListener('click',async()=>{if(!confirm('Activate emergency STOP? New actions passing through the gate will be blocked and pending approvals cancelled. This does not delete data.'))return;try{await apiCall('/control/stop',nicOwnerToken,{});await loadControlStatus();}catch(e){$('controlStatus').textContent='STOP request failed: '+e.message;}});
$('resumeNic').addEventListener('click',async()=>{if(!confirm('Resume the control gate? This does not grant approval for any individual action.'))return;try{await apiCall('/control/resume',nicOwnerToken,{});await loadControlStatus();}catch(e){$('controlStatus').textContent='Resume request failed: '+e.message;}});
$('refreshApprovals').addEventListener('click',async()=>{try{await loadControlStatus();}catch(e){$('controlStatus').textContent='Could not refresh controls: '+e.message;}});
refresh();setInterval(refresh,20000);
</script>
</script>
</body></html>
