name: NIC Revenue Learning Production Wiring PR Checks

on:
  pull_request:
    paths:
      - '.github/workflows/autonomous-market-creator.yml'
      - 'tests/test_nic_revenue_learning_wiring.py'
      - '.github/workflows/nic-revenue-learning-wiring-pr.yml'
      - 'src/revenue_content_director.py'
      - 'tests/test_revenue_readiness_truth_gate.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-wiring:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile monetization learning modules
        run: python -m py_compile src/nic_reward_evidence.py src/nic_revenue_pattern_lab.py src/revenue_content_director.py
      - name: Verify production wiring and safety
        run: python -m unittest discover -s tests -p 'test_nic_revenue_learning_wiring.py' -v
      - name: Verify monetization readiness truth gate
        run: python -m unittest discover -s tests -p 'test_revenue_readiness_truth_gate.py' -v
      - name: Check workflow syntax and whitespace
        run: git diff --check
