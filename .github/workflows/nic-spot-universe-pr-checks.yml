name: NIC Verified Spot Universe PR Checks
on:
  pull_request:
    paths:
      - 'src/nic_prediction_engine.py'
      - 'tests/test_nic_prediction_engine_universe.py'
      - '.github/workflows/nic-spot-universe-pr-checks.yml'
  push:
    branches: [main]
    paths:
      - 'src/nic_prediction_engine.py'
      - 'tests/test_nic_prediction_engine_universe.py'
      - '.github/workflows/nic-spot-universe-pr-checks.yml'
permissions:
  contents: read
concurrency:
  group: nic-spot-universe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verified-spot-universe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile prediction engine
        run: python -m py_compile src/nic_prediction_engine.py
      - name: Test verified exchange-universe admission
        run: python tests/test_nic_prediction_engine_universe.py
