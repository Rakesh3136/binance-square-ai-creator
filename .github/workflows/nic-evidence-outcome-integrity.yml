name: NIC Evidence-to-Outcome Integrity
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nic-evidence-outcome-integrity.yml'
      - 'src/nic_evidence_outcome_integrity.py'
      - 'src/nic_forecast_profitability.py'
      - 'src/nic_forecast_laboratory.py'
      - 'tests/test_nic_evidence_outcome_integrity.py'
      - 'tests/test_nic_forecast_laboratory.py'
      - 'data/intelligence/nic_forecast_profitability.json'
      - 'data/intelligence/nic_forecast_truth_ledger.jsonl'
      - 'data/intelligence/nic_forecast_outcome_events.jsonl'
  pull_request:
    paths:
      - 'src/nic_evidence_outcome_integrity.py'
      - 'tests/test_nic_evidence_outcome_integrity.py'
      - '.github/workflows/nic-evidence-outcome-integrity.yml'
      - 'src/nic_forecast_profitability.py'
      - 'src/nic_forecast_laboratory.py'
      - 'tests/test_nic_forecast_laboratory.py'
      - 'data/intelligence/nic_forecast_profitability.json'
      - 'data/intelligence/nic_forecast_truth_ledger.jsonl'
      - 'data/intelligence/nic_forecast_outcome_events.jsonl'
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 1,4"
permissions:
  contents: read
concurrency:
  group: nic-evidence-outcome-integrity
  cancel-in-progress: false
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile integrity validator
        run: python -m py_compile src/nic_evidence_outcome_integrity.py
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Test evidence reconciliation with controlled fixtures
        run: python -m pytest -q tests/test_nic_evidence_outcome_integrity.py tests/test_nic_forecast_laboratory.py
      - name: Audit committed evidence and profitability report
        run: |
          set +e
          python src/nic_evidence_outcome_integrity.py
          status=$?
          echo "NIC_EVIDENCE_INTEGRITY_EXIT=$status" >> "$GITHUB_ENV"
          exit 0
      - name: Upload integrity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nic-evidence-outcome-integrity-${{ github.run_id }}
          path: data/intelligence/nic_evidence_outcome_integrity.json
          if-no-files-found: error
      - name: Fail CI on contradictory evidence
        if: always() && env.NIC_EVIDENCE_INTEGRITY_EXIT == '1'
        run: |
          echo "NIC evidence/report contradiction detected; see the integrity report artifact."
          exit 1
      - name: Record insufficient evidence without calling it a test failure
        if: always() && env.NIC_EVIDENCE_INTEGRITY_EXIT == '2'
        run: |
          echo "Evidence integrity is BLOCKED: no sufficient joined, provenance-complete outcome evidence. Profitability remains NOT_PROVEN."
