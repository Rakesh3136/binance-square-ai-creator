name: NIC Evidence-to-Outcome Integrity
on:
  pull_request:
    paths:
      - 'src/nic_evidence_outcome_integrity.py'
      - 'tests/test_nic_evidence_outcome_integrity.py'
      - '.github/workflows/nic-evidence-outcome-integrity.yml'
      - 'src/nic_forecast_profitability.py'
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 1,4"
permissions:
  contents: read
concurrency:
  group: nic-evidence-outcome-integrity
  cancel-in-progress: false
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile integrity validator
        run: python -m py_compile src/nic_evidence_outcome_integrity.py
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Test evidence reconciliation with controlled fixtures
        if: github.event_name == 'pull_request'
        run: python -m pytest -q tests/test_nic_evidence_outcome_integrity.py
      - name: Audit production forecast evidence
        if: github.event_name != 'pull_request'
        run: |
          set +e
          python src/nic_evidence_outcome_integrity.py
          status=$?
          echo "NIC_EVIDENCE_INTEGRITY_EXIT=$status" >> "$GITHUB_ENV"
          exit 0
      - name: Upload integrity report
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: nic-evidence-outcome-integrity-${{ github.run_id }}
          path: data/intelligence/nic_evidence_outcome_integrity.json
          if-no-files-found: error
      - name: Fail closed unless production evidence is verified
        if: always() && github.event_name != 'pull_request' && env.NIC_EVIDENCE_INTEGRITY_EXIT != '0'
        run: |
          echo "NIC evidence integrity is blocked or failed; see uploaded report."
          exit 1
