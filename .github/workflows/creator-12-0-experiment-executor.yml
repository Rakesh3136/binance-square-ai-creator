name: Creator 12.0 Autonomous Experiment Executor

on:
  schedule:
    - cron: '13 */3 * * *'
  workflow_dispatch:

concurrency:
  group: main-branch-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  execute-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run bounded experiment executor
        run: python src/creator_12_0_experiment_executor.py

      - name: Validate generated artifacts
        run: |
          python -m json.tool data/live/creator_12_0_active_experiment.json >/dev/null
          python -m json.tool data/intelligence/creator_12_0_report.json >/dev/null
          python -m json.tool analytics/strategy_memory.json >/dev/null
          python -m compileall -q src

      - name: Commit experiment state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/live/creator_12_0_active_experiment.json data/intelligence/creator_12_0_report.json analytics/strategy_memory.json
          git diff --cached --quiet || git commit -m 'chore: update Creator 12.0 experiment state'
          git push
