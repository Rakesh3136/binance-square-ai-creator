name: NIC18 workflow repair (one-time)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore canonical orchestrator and activate NIC18
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET=.github/workflows/autonomous-market-creator.yml
          GOOD=6621fa6493bab82fb86d71434fe847e7c9cdb8c1
          git show "$GOOD:$TARGET" > "$TARGET"
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/autonomous-market-creator.yml')
          s=p.read_text()
          anchor='          python src/technical_enricher.py\n'
          insert=(anchor+""
          "          python -m py_compile src/nic_pattern_visual_engine_18.py\n"
          "          python tests/test_nic_pattern_visual_engine_18.py\n"
          "          python src/nic_pattern_visual_engine_18.py\n"
          "          python -m json.tool data/live/nic_pattern_visual_engine_18.json >/dev/null\n")
          if 'python src/nic_pattern_visual_engine_18.py' not in s:
              if anchor not in s:
                  raise SystemExit('technical_enricher workflow anchor missing')
              s=s.replace(anchor,insert,1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET"
          git commit -m 'Restore canonical orchestrator and activate NIC 18' || true
          git push origin main
          rm -f .github/workflows/nic18-repair-once.yml
          git add .github/workflows/nic18-repair-once.yml
          git commit -m 'Remove one-time workflow repair'
          git push origin main
