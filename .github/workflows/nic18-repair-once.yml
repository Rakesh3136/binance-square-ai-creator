name: NIC18 workflow repair (one-time)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore canonical orchestrator atomically
        run: |
          set -euo pipefail
          TARGET=.github/workflows/autonomous-market-creator.yml
          GOOD=6621fa6493bab82fb86d71434fe847e7c9cdb8c1
          git fetch origin main --prune
          BASE=$(git rev-parse origin/main)
          git reset --hard "$BASE"
          if grep -q 'Refresh full market universe, flow, news and core intelligence' "$TARGET" && grep -q 'python src/visual_renderer.py' "$TARGET"; then
            echo 'Canonical orchestrator is already complete; removing repair workflow.'
          else
            git show "$GOOD:$TARGET" > "$TARGET"
            python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/autonomous-market-creator.yml')
          s=p.read_text()
          anchor='          python src/technical_enricher.py\n'
          insert=anchor+'''          python -m py_compile src/nic_pattern_visual_engine_18.py\n          python tests/test_nic_pattern_visual_engine_18.py\n          python src/nic_pattern_visual_engine_18.py\n          python -m json.tool data/live/nic_pattern_visual_engine_18.json >/dev/null\n'''
          if 'python src/nic_pattern_visual_engine_18.py' not in s:
              if anchor not in s: raise SystemExit('technical_enricher workflow anchor missing')
              s=s.replace(anchor,insert,1)
          p.write_text(s)
          PY
            echo 'Canonical orchestrator restored and NIC18 activated.'
          fi
          rm -f .github/workflows/nic18-repair-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/autonomous-market-creator.yml .github/workflows/nic18-repair-once.yml
          git commit -m 'Restore full autonomous orchestrator and remove repair workflow' || true
          git fetch origin main --prune
          REMOTE=$(git rev-parse origin/main)
          git push --force-with-lease=refs/heads/main:$REMOTE origin HEAD:main
