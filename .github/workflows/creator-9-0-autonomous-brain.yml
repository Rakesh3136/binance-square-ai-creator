name: Binance Square AI Creator 9.0 - Autonomous Brain

on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:

concurrency:
  group: main-branch-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  brain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Creator 9.0 Brain
        run: python src/creator_9_0_autonomous_brain.py
      - name: Persist brain state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/live/creator_9_0_brain_state.json data/intelligence/creator_9_0_report.json analytics/strategy_memory.json
          if git diff --cached --quiet; then exit 0; fi
          git pull --rebase --autostash origin main
          git add data/live/creator_9_0_brain_state.json data/intelligence/creator_9_0_report.json analytics/strategy_memory.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore: update Creator 9.0 autonomous brain'
          git push origin HEAD:main
