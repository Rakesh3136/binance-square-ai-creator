name: Binance Square AI Creator 11.0 - Continuous Improvement

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

concurrency:
  group: main-branch-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  continuous-improvement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run continuous improvement engine
        run: python src/creator_11_0_continuous_improvement.py

      - name: Persist Creator 11.0 state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analytics/creator_11_0_improvement_state.json analytics/strategy_memory.json data/intelligence/creator_11_0_report.json
          if git diff --cached --quiet; then
            echo 'No Creator 11.0 state changes.'
          else
            git commit -m 'chore: persist Creator 11.0 improvement plan'
            git push
          fi
