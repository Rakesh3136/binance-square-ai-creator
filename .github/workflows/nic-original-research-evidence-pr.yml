name: NIC Original Research Evidence Tests

on:
  pull_request:
    paths:
      - "src/original_research_engine.py"
      - "tests/test_original_research_live_universe.py"
      - ".github/workflows/nic-original-research-evidence-pr.yml"
  push:
    branches: [main]
    paths:
      - "src/original_research_engine.py"
      - "tests/test_original_research_live_universe.py"
      - ".github/workflows/nic-original-research-evidence-pr.yml"

permissions:
  contents: read

jobs:
  original-research-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Compile research engine and tests
        run: python -m py_compile src/original_research_engine.py tests/test_original_research_live_universe.py
      - name: Test live universe and evidence freshness
        run: python -m pytest -q tests/test_original_research_live_universe.py
