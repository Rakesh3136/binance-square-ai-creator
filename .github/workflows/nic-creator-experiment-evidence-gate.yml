name: NIC Creator Experiment Evidence Gate

on:
  pull_request:
    paths:
      - "src/nic_creator_experiment_gate.py"
      - "tests/test_nic_creator_experiment_gate.py"
      - ".github/workflows/nic-creator-experiment-gate.yml"
  push:
    branches:
      - main
    paths:
      - "src/nic_creator_experiment_gate.py"
      - "tests/test_nic_creator_experiment_gate.py"
      - ".github/workflows/nic-creator-experiment-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-gate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile module and tests
        run: python -m py_compile src/nic_creator_experiment_gate.py tests/test_nic_creator_experiment_gate.py
      - name: Run evidence-gate regression tests
        run: python -m unittest discover -s tests -p "test_nic_creator_experiment_gate.py" -v
