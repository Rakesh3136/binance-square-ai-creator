name: Binance Square Creator — Autonomous Publish Recovery

on:
  workflow_run:
    workflows:
      - Binance Square AI Creator — Single Autonomous Orchestrator
    types:
      - completed

permissions:
  contents: write
  actions: read

concurrency:
  group: autonomous-publish-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt

      - name: Verify recovery is needed for this creator run
        id: need_recovery
        env:
          CREATOR_FINISHED_AT: ${{ github.event.workflow_run.updated_at }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          p = Path('data/live/elite_prepublication_judge.json')
          recover = False
          draft = ''
          reason = 'no_current_elite_rejection'

          if p.exists():
              try:
                  result = json.loads(p.read_text(encoding='utf-8'))
                  generated = datetime.fromisoformat(str(result.get('generated_at','')).replace('Z','+00:00'))
                  finished = datetime.fromisoformat(os.environ['CREATOR_FINISHED_AT'].replace('Z','+00:00'))
                  failures = result.get('failures') or []
                  draft = str(result.get('draft_path') or '')
                  # Only recover a judge result generated during this creator run.
                  current = abs((finished - generated).total_seconds()) <= 900
                  recover = current and bool(failures) and bool(draft)
                  reason = ','.join(str(x) for x in failures) if recover else reason
              except Exception as exc:
                  reason = f'invalid_judge:{exc}'

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f"recover={'true' if recover else 'false'}\n")
              f.write(f"reason={reason}\n")
              f.write(f"draft={draft}\n")
          print({'recover': recover, 'reason': reason, 'draft': draft})
          PY

      - name: Run bounded fresh-draft recovery
        if: ${{ steps.need_recovery.outputs.recover == 'true' }}
        env:
          DRAFT_PATH: ${{ steps.need_recovery.outputs.draft }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          GEMINI_DAILY_BUDGET: '20'
        run: |
          python -m compileall -q src
          python src/autonomous_publish_recovery.py

      - name: Stop cleanly when no recovery was required
        if: ${{ steps.need_recovery.outputs.recover != 'true' }}
        run: echo "No bounded publication recovery required: ${{ steps.need_recovery.outputs.reason }}"

      - name: Validate recovered content
        if: ${{ steps.need_recovery.outputs.recover == 'true' }}
        env:
          DRAFT_PATH: ${{ steps.need_recovery.outputs.draft }}
        run: |
          python src/content_integrity_gate_4.py
          python src/elite_prepublication_judge.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/live/elite_prepublication_judge.json')
          result=json.loads(p.read_text(encoding='utf-8'))
          if result.get('publish') is not True or result.get('failures'):
              raise SystemExit(f"Recovery still blocked: {result.get('failures')}")
          print('Recovered draft passed elite pre-publication gate')
          PY

      - name: Render and validate visual
        if: ${{ steps.need_recovery.outputs.recover == 'true' }}
        env:
          DRAFT_PATH: ${{ steps.need_recovery.outputs.draft }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          ctx=json.loads(Path('data/live/publication_context.json').read_text()) if Path('data/live/publication_context.json').exists() else {}
          cat=str(ctx.get('category','')).lower()
          required=cat == 'crypto_meme' or cat not in {'education','commentary','community'}
          mode='meme' if cat == 'crypto_meme' else 'tradingview'
          Path('/tmp/visual_mode').write_text(json.dumps({'required':required,'mode':mode}))
          print({'required':required,'mode':mode})
          PY
          required=$(python -c "import json; print(str(json.load(open('/tmp/visual_mode'))['required']).lower())")
          mode=$(python -c "import json; print(json.load(open('/tmp/visual_mode'))['mode'])")
          if [ "$required" = "true" ]; then
            if [ "$mode" = "meme" ]; then
              python src/meme_renderer.py
            else
              npm install --no-save playwright
              npx playwright install --with-deps chromium
              python src/visual_renderer.py
            fi
            test -s data/live/visual.png
            python src/validate_visual.py
            provider=$(python -c 'import json; print(json.load(open("data/live/visual_metadata.json")).get("provider",""))')
            if [ "$provider" = "TradingView" ]; then python src/validate_tradingview_visual.py data/live/visual.png; fi
          else
            echo 'No visual required for recovered lane.'
          fi

      - name: Final recovered production gate
        if: ${{ steps.need_recovery.outputs.recover == 'true' }}
        id: production
        env:
          DRAFT_PATH: ${{ steps.need_recovery.outputs.draft }}
        run: |
          python src/production_manager.py
          publish=$(python -c 'import json; print(str(json.load(open("data/live/production_decision.json")).get("publish", False)).lower())')
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          test "$publish" = "true"

      - name: Publish recovered post
        if: ${{ steps.production.outputs.publish == 'true' }}
        env:
          DRAFT_PATH: ${{ steps.need_recovery.outputs.draft }}
          BINANCE_SQUARE_API_KEY: ${{ secrets.BINANCE_SQUARE_API_KEY }}
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
        run: |
          python src/extract_publication.py
          python src/write_to_earn_eligibility_gate.py
          python src/binance_square_publisher.py
          python src/creator_20_0_publication_verifier.py
          python src/call_tracker.py
          python src/creator_8_0_revenue_engine.py

      - name: Persist recovered state
        if: ${{ always() }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --mixed origin/main
          git add analytics data
          if git diff --cached --quiet; then
            echo 'No recovered generated state changes to persist'
          else
            git commit -m 'Record autonomous publication recovery'
            git push origin HEAD:main
          fi
