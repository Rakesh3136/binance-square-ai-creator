name: Creator 4.1 Autostart

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/creator-4-1-autostart.yml"

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch upgraded autonomous creator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/Rakesh3136/binance-square-ai-creator/actions/workflows/autonomous-market-creator.yml/dispatches" \
            -f ref="main" \
            -f "inputs[topic]="
          echo "Creator 4.1 dispatched."
