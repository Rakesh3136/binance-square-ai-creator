name: NIC Assistant Chat Adapter Tests

on:
  pull_request:
    paths:
      - 'src/nic_assistant_chat.py'
      - 'src/nic_assistant_chat_client.py'
      - 'tests/test_nic_assistant_chat.py'
      - 'tests/test_nic_assistant_chat_client.py'
      - 'tests/test_nic_assistant_control_api.py'
      - 'src/nic_control_gate.py'
      - 'tests/test_nic_control_gate.py'
      - 'requirements.txt'
      - '.github/workflows/nic-assistant-chat-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'src/nic_assistant_chat.py'
      - 'tests/test_nic_assistant_chat.py'
      - 'src/nic_control_gate.py'
      - 'tests/test_nic_control_gate.py'
      - 'requirements.txt'
      - '.github/workflows/nic-assistant-chat-tests.yml'

permissions:
  contents: read

jobs:
  assistant-chat-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --no-cache-dir -r requirements.txt
          python -m pip install pytest
      - name: Compile assistant and control-gate modules
        run: python -m py_compile src/nic_assistant_chat.py src/nic_assistant_chat_client.py src/nic_control_gate.py
      - name: Test assistant adapter without API credentials
        run: |
          python tests/test_nic_assistant_chat.py
          python tests/test_nic_assistant_chat_client.py
          python tests/test_nic_assistant_control_api.py
      - name: Test control gate approval and emergency-stop invariants
        run: python -m pytest -q tests/test_nic_control_gate.py
