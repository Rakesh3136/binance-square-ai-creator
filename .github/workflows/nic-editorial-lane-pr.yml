name: NIC Editorial Lane PR Checks

on:
  pull_request:
    paths:
      - 'src/nic_editorial_lane_gate.py'\n      - 'src/nic_editorial_context_sync.py'\n      - 'tests/test_nic_editorial_context_sync.py'
      - 'tests/test_nic_editorial_lane_gate.py'
      - '.github/workflows/autonomous-market-creator.yml'
      - '.github/workflows/nic-editorial-lane-pr.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editorial-lane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile editorial lane gate
        run: python -m py_compile src/nic_editorial_lane_gate.py
      - name: Run editorial lane fail-closed tests
        run: python tests/test_nic_editorial_lane_gate.py
