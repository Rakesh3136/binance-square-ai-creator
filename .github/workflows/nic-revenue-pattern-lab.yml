name: NIC — Revenue Pattern Lab
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run keyless monetization intelligence
        run: |
          python src/nic_revenue_pattern_lab.py
          python -m json.tool data/live/nic_revenue_pattern_lab.json >/dev/null
          python -m json.tool data/intelligence/nic_revenue_pattern_lab_report.json >/dev/null
      - name: Persist NIC revenue intelligence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analytics data/live data/intelligence
          git diff --cached --quiet || git commit -m 'Update NIC revenue pattern intelligence'
          git pull --rebase --autostash origin main || true
          git push origin main || true
