name: NIC Distillation Lab PR Checks

on:
  pull_request:
    paths:
      - 'src/nic_distillation_lab.py'
      - 'tests/test_nic_distillation_lab.py'
      - '.github/workflows/nic-distillation-lab-pr.yml'
  push:
    branches: [main]
    paths:
      - 'src/nic_distillation_lab.py'
      - 'tests/test_nic_distillation_lab.py'
      - '.github/workflows/nic-distillation-lab-pr.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile distillation dataset builder
        run: python -m py_compile src/nic_distillation_lab.py
      - name: Install pytest
        run: python -m pip install pytest
      - name: Test evidence and leakage gates
        run: python -m pytest -q tests/test_nic_distillation_lab.py
