name: Repair Main Creator Workflow

on:
  push:
    paths:
      - '.github/repair-main-workflow.trigger'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore orchestrator from known-good commit
        run: |
          set -euo pipefail
          git show 3a1da9a4cbe8ad88259fdb348c9601960d8df0f5:.github/workflows/autonomous-market-creator.yml > .github/workflows/autonomous-market-creator.yml
          test -s .github/workflows/autonomous-market-creator.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/autonomous-market-creator.yml
          git commit -m 'Restore autonomous creator workflow after accidental truncation'
          git push origin main
      - name: Remove repair helper
        run: |
          rm -f .github/workflows/repair-main-workflow.yml .github/repair-main-workflow.trigger
          git add -A .github
          git commit -m 'Remove temporary workflow repair helper' || true
          git push origin main || true
