name: Publication Opportunity Recovery

on:
  schedule:
    - cron: '11 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: publication-opportunity-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
      - name: Check duplicate state and recover candidate selection
        id: recover
        run: |
          python src/publication_opportunity_recovery.py
          selected=$(python -c 'import json; p="data/live/signal_first_routing.json"; x=json.load(open(p)) if __import__("os").path.exists(p) else {}; print("true" if x.get("publish") is True and isinstance(x.get("selected"),dict) else "false")')
          echo "selected=$selected" >> "$GITHUB_OUTPUT"
      - name: Dispatch full creator cycle with recovered candidate pool
        if: ${{ steps.recover.outputs.selected == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/live/signal_first_routing.json
          git diff --cached --quiet || git commit -m 'Record recovered publication opportunity selection'
          git pull --rebase --autostash origin main
          git push origin main
          gh workflow run autonomous-market-creator.yml --repo "${{ github.repository }}"
      - name: No-op when no safe alternative exists
        if: ${{ steps.recover.outputs.selected != 'true' }}
        run: echo 'No independently verified non-duplicate opportunity found; publication safety remains authoritative.'
