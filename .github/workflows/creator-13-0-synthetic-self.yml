name: Creator 13.0 — Synthetic Self & Executive Brain

on:
  schedule:
    - cron: '31 */3 * * *'
  workflow_dispatch:

concurrency:
  group: main-branch-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  synthetic-self:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Creator 13.0 Executive Brain
        run: python src/creator_13_0_synthetic_self.py

      - name: Validate generated state
        run: |
          python -m json.tool analytics/creator_13_0_self_state.json >/dev/null
          python -m json.tool data/live/creator_13_0_executive_decision.json >/dev/null
          python -m json.tool data/intelligence/creator_13_0_report.json >/dev/null

      - name: Persist Creator 13.0 state
        run: |
          git config user.name 'creator-13-0-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analytics/creator_13_0_self_state.json analytics/strategy_memory.json data/live/creator_13_0_executive_decision.json data/intelligence/creator_13_0_report.json
          git diff --cached --quiet || git commit -m 'chore: update creator 13.0 synthetic self state'
          git push origin main
