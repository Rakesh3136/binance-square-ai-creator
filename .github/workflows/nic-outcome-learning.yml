name: NIC Outcome Learning

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [main]
    paths:
      - 'data/live/prediction_outcomes.json'
      - 'data/live/publication_result.json'
      - 'data/live/prediction_contract.json'
      - 'src/nic_outcome_learner.py'

permissions:
  contents: write

concurrency:
  group: nic-outcome-learning
  cancel-in-progress: true

jobs:
  learn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build outcome ledger
        run: python src/nic_outcome_learner.py
      - name: Persist learning state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/live/nic_outcome_ledger.jsonl data/live/nic_learning_state.json
          git diff --cached --quiet || git commit -m 'Record NIC verified outcome learning state'
          git pull --rebase --autostash origin main
          git push origin main
