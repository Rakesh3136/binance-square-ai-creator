name: Trigger canonical orchestrator validation

on:
  push:
    branches: [main]
    paths:
      - '.github/creator-recovery.trigger'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  dispatch_and_validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch canonical Single Autonomous Orchestrator
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA}"
          BEFORE="$(gh run list --repo "$REPO" --workflow 'autonomous-market-creator.yml' --limit 20 --json databaseId,headSha,status --jq '[.[] | select(.headSha=="'$SHA'")] | map(.databaseId) | .[]' || true)"
          gh workflow run autonomous-market-creator.yml --repo "$REPO" --ref main
          echo "DISPATCH_SHA=$SHA" >> "$GITHUB_ENV"
          echo "Existing creator runs for trigger commit: ${BEFORE:-none}"

      - name: Verify canonical creator run starts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          found=""
          for i in $(seq 1 30); do
            found="$(gh run list --repo "$REPO" --workflow 'autonomous-market-creator.yml' --limit 20 --json databaseId,headSha,status,event,createdAt --jq '[.[] | select(.headSha=="'$DISPATCH_SHA'")] | .[0].databaseId' 2>/dev/null || true)"
            if [ -n "$found" ] && [ "$found" != "null" ]; then
              echo "Canonical orchestrator run detected: $found"
              echo "run_id=$found" >> "$GITHUB_OUTPUT"
              break
            fi
            sleep 5
          done
          test -n "$found" && test "$found" != "null"

      - name: Verify creator job exists
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          run_id="$(gh run list --repo "$REPO" --workflow 'autonomous-market-creator.yml' --limit 1 --json databaseId --jq '.[0].databaseId')"
          jobs="$(gh run view "$run_id" --repo "$REPO" --json jobs --jq '.jobs[].name')"
          echo "$jobs"
          echo "$jobs" | grep -Fx 'creator' >/dev/null

      - name: Emit validation status
        run: echo "VALIDATION_PASS canonical Single Autonomous Orchestrator creator job was dispatched and detected"
