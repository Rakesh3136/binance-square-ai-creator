name: Run Creator Now

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional topic; leave blank for autonomous selection"
        required: false
        default: ""

permissions:
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch autonomous creator via GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          TOPIC: ${{ inputs.topic }}
        run: |
          set -euo pipefail
          if ! gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/Rakesh3136/binance-square-ai-creator/actions/workflows/autonomous-market-creator.yml/dispatches" \
            -f ref="main" \
            -f "inputs[topic]=${TOPIC}"; then
            echo "Failed to dispatch Autonomous Market Creator"
            exit 1
          fi
          echo "Autonomous Market Creator dispatched successfully."
