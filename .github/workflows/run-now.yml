name: Run Creator Now

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional topic; leave blank for autonomous selection"
        required: false
        default: ""

permissions:
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch autonomous creator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run autonomous-market-creator.yml \
            --repo Rakesh3136/binance-square-ai-creator \
            --ref main \
            --field topic="${{ inputs.topic }}"
