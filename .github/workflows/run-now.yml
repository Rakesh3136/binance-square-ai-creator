name: Run Creator Now

on:
  push:
    paths:
      - ".github/workflows/run-now.yml"

permissions:
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch autonomous creator
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run autonomous-market-creator.yml --ref main
