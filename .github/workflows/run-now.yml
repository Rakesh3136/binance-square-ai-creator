name: Run Creator Now

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional topic; leave blank for autonomous selection"
        required: false
        default: ""
        type: string
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/autonomous-market-creator.yml'
      - '.github/workflows/run-now.yml'

permissions:
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch autonomous creator
        env:
          GH_TOKEN: ${{ github.token }}
          TOPIC: ${{ inputs.topic || '' }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/Rakesh3136/binance-square-ai-creator/actions/workflows/autonomous-market-creator.yml/dispatches" \
            -f ref="main" \
            -f "inputs[topic]=${TOPIC}"
          echo "Autonomous Market Creator dispatched successfully."
