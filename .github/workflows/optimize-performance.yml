name: Optimize Creator Strategy

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run performance optimizer
        run: python src/analytics_optimizer.py

      - name: Save strategy memory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics/strategy_memory.json
          git diff --cached --quiet && exit 0
          git commit -m "Update creator strategy memory"
          git push
