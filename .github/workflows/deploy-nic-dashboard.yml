name: Deploy NIC Command Center

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'data/live/nic_dashboard.json'
      - 'data/live/nic_core_state.json'
      - 'data/live/nic_activity.jsonl'
      - '.github/workflows/deploy-nic-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: dashboard

      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
