name: Creator 7.4 Adaptive Experiment Controller

on:
  schedule:
    - cron: '57 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-branch-writer
  cancel-in-progress: false

jobs:
  controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build next adaptive experiment
        run: python src/creator_7_4_adaptive_experiment_controller.py
      - name: Save adaptive experiment state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analytics/creator_7_4_experiment_plan.json analytics/strategy_memory.json data/intelligence/creator_7_4_report.json
          git diff --cached --quiet && exit 0
          git pull --rebase --autostash origin main
          git add analytics/creator_7_4_experiment_plan.json analytics/strategy_memory.json data/intelligence/creator_7_4_report.json
          git diff --cached --quiet && exit 0
          git commit -m 'Run Creator 7.4 adaptive experiment controller'
          git push origin main
