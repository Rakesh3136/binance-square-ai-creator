name: NIC Creator Experiment Scorecard PR Checks
on:
  pull_request:
    paths:
      - 'src/nic_creator_experiment_scorecard.py'
      - 'tests/test_nic_creator_experiment_scorecard.py'
      - '.github/workflows/nic-creator-experiment-pr.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run scorecard tests
        run: python -m pytest -q tests/test_nic_creator_experiment_scorecard.py
