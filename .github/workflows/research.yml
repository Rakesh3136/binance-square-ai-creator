name: AI Research Test

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic to research'
        required: true
        default: 'Bitcoin market overview'

jobs:
  research:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run research engine
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6
          TOPIC: ${{ inputs.topic }}
        run: python app.py

      - name: Save research report
        run: |
          git config user.name 'binance-square-ai-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/reports
          git diff --cached --quiet || git commit -m 'Add AI research report'
          git push
