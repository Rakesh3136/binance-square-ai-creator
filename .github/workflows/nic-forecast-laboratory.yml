name: NIC Forecast Laboratory
on:
  push:
    branches: [main]
    paths: ["src/nic_forecast_laboratory.py","tests/test_nic_forecast_laboratory.py",".github/workflows/nic-forecast-laboratory.yml","data/live/nic_prediction_engine.json"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  laboratory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m py_compile src/nic_forecast_laboratory.py tests/test_nic_forecast_laboratory.py
      - run: python tests/test_nic_forecast_laboratory.py
      - run: python src/nic_forecast_laboratory.py
      - run: |
          python - <<'PY'
          import json
          d=json.load(open("data/live/nic_forecast_laboratory.json"))
          assert d["schema"]=="NIC-FORECAST-LAB-1.0" and d["policy"]["competing_hypotheses"] and d["policy"]["base_rate_lift_required"]
          print("Forecast Laboratory validation: PASS")
          PY
      - name: Commit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live/nic_forecast_laboratory.json data/intelligence/nic_forecast_laboratory_report.json
          git diff --cached --quiet || git commit -m "Record NIC Forecast Laboratory evidence"
          git pull --rebase --autostash origin main
          git push origin main || true
