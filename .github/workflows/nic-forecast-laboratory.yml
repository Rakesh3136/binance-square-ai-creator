name: NIC Forecast Laboratory
# Triggered on main changes and manually; evidence loop validation is intentionally explicit.
on:
  push:
    branches: [main]
    paths: ["src/nic_winning_post_dna.py","tests/test_nic_winning_post_dna.py","src/content_portfolio_planner.py","src/nic_forecast_laboratory.py","src/nic_forecast_outcome_resolver.py","tests/test_nic_forecast_laboratory.py","tests/test_nic_forecast_outcome_resolver.py","src/nic_forecast_evidence_adapter.py","src/nic_forecast_calibrator.py","tests/test_nic_forecast_calibrator.py","src/nic_signal_family_governance.py","tests/test_nic_signal_family_governance.py","src/nic_signal_attribution.py","tests/test_nic_signal_attribution.py","src/nic_forecast_champion.py","tests/test_nic_forecast_champion.py","src/nic_forecast_decision_policy.py","tests/test_nic_forecast_decision_policy.py","src/nic_decision_outcome.py","src/nic_decision_outcome_resolver.py","tests/test_nic_decision_outcome.py","tests/test_nic_decision_outcome_resolver.py","src/nic_regime_transition.py","src/nic22_2_early_opportunity_engine.py","tests/test_nic22_2_early_opportunity_engine.py","src/nic22_3_early_confirmation_engine.py","tests/test_nic22_3_early_confirmation_engine.py","tests/test_nic22_2_forecast_integration.py","tests/test_nic_forecast_evidence_adapter.py","tests/test_nic_regime_transition.py",".github/workflows/nic-forecast-laboratory.yml","data/live/nic_prediction_engine.json","src/nic_forecast_outcome_resolver.py","tests/test_nic_forecast_outcome_resolver.py"]
  workflow_dispatch:
concurrency:
  group: nic-forecast-laboratory-main
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  laboratory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m py_compile src/nic_winning_post_dna.py src/content_portfolio_planner.py tests/test_nic_winning_post_dna.py src/nic_forecast_laboratory.py src/nic_forecast_outcome_resolver.py src/nic_forecast_calibrator.py src/nic_forecast_governance.py src/nic_signal_family_governance.py src/nic_signal_attribution.py src/nic_forecast_champion.py src/nic_forecast_decision_policy.py src/nic_decision_outcome.py src/nic_decision_outcome_resolver.py src/nic_forecast_evidence_adapter.py src/nic_regime_transition.py tests/test_nic_forecast_laboratory.py tests/test_nic_forecast_outcome_resolver.py tests/test_nic_forecast_calibrator.py tests/test_nic_forecast_governance.py tests/test_nic_signal_family_governance.py tests/test_nic_signal_attribution.py tests/test_nic_forecast_champion.py tests/test_nic_forecast_decision_policy.py tests/test_nic_decision_outcome.py tests/test_nic_decision_outcome_resolver.py tests/test_nic_forecast_evidence_adapter.py tests/test_nic22_2_early_opportunity_engine.py src/nic22_3_early_confirmation_engine.py tests/test_nic22_3_early_confirmation_engine.py tests/test_nic22_2_forecast_integration.py tests/test_nic_regime_transition.py
      - run: python tests/test_nic_winning_post_dna.py
      - run: python src/nic_winning_post_dna.py
      - run: python tests/test_nic_forecast_laboratory.py
      - run: python tests/test_nic_forecast_outcome_resolver.py
      - run: python tests/test_nic_signal_attribution.py
      - run: python tests/test_nic_forecast_champion.py
      - run: python tests/test_nic_forecast_decision_policy.py
      - run: python tests/test_nic_decision_outcome.py
      - run: python tests/test_nic_decision_outcome_resolver.py
      - run: python tests/test_nic_forecast_evidence_adapter.py
      - run: python tests/test_nic22_2_early_opportunity_engine.py
      - run: python tests/test_nic22_3_early_confirmation_engine.py
      - run: python tests/test_nic22_2_forecast_integration.py
      - run: python tests/test_nic_forecast_calibrator.py
      - run: python tests/test_nic_regime_transition.py
      # Resolve matured prior forecasts before this cycle builds its learning matrix.
      - run: python src/nic_forecast_outcome_resolver.py
      - run: python src/nic_forecast_laboratory.py
      - run: python src/nic_decision_outcome_resolver.py
      - run: python src/nic_forecast_calibrator.py
      - run: python src/nic_forecast_governance.py
      - run: python src/nic_signal_family_governance.py
      - run: python src/nic_forecast_champion.py
      - run: python src/nic_signal_attribution.py
      - run: |
          python - <<'PY'
          import json
          d=json.load(open("data/live/nic_forecast_laboratory.json"))
          assert d["schema"]=="NIC-FORECAST-LAB-2.0"
          assert d["learning"]["walk_forward_validation"]
          assert d["learning"]["persistent_outcome_resolution"]
          assert d["policy"]["neutral_wait_allowed"]
          print("Forecast Laboratory learning validation: PASS")
          PY
      - name: Verify persisted learning artifacts agree
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("data/intelligence")
          def jsonl(name):
              p=root/name
              if not p.exists(): return []
              rows=[]
              for line in p.read_text().splitlines():
                  try: rows.append(json.loads(line))
                  except json.JSONDecodeError: raise AssertionError(f"Invalid JSONL row in {name}")
              return rows
          snapshots=jsonl("nic_forecast_truth_ledger.jsonl")
          events=jsonl("nic_forecast_outcome_events.jsonl")
          terminal={str(x.get("forecast_id")) for x in events if x.get("event_type")=="FORECAST_RESOLVED" and x.get("forecast_id")}
          legacy={str(x.get("forecast_id")) for x in snapshots if x.get("resolved") and x.get("forecast_id")}
          calibration=json.loads((root/"nic_forecast_calibration.json").read_text())
          matrix=json.loads((root/"nic_signal_predictivity_matrix.json").read_text())
          scored=int(calibration.get("global_metrics",{}).get("samples") or 0)
          resolved_ids=terminal | legacy
          if scored and not resolved_ids:
              raise AssertionError("Calibration scores exist but no resolved forecast IDs exist in either ledger")
          if int(matrix.get("resolved_event_count") or 0) != len(terminal):
              raise AssertionError("Signal matrix resolved-event count does not match terminal outcome ledger")
          print(json.dumps({"snapshots":len(snapshots),"terminal_events":len(terminal),
                            "resolved_ids":len(resolved_ids),"calibration_samples":scored,
                            "matrix_resolved_event_count":matrix.get("resolved_event_count"),
                            "persisted_learning_artifacts":"PASS"}))
          PY
      - name: Commit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/nic-evidence
          cp data/live/nic_forecast_laboratory.json /tmp/nic-evidence/
          cp data/intelligence/nic_forecast_laboratory_report.json /tmp/nic-evidence/
          cp data/intelligence/nic_forecast_truth_ledger.jsonl /tmp/nic-evidence/
          cp data/intelligence/nic_forecast_outcome_events.jsonl /tmp/nic-evidence/
          cp data/intelligence/nic_signal_predictivity_matrix.json /tmp/nic-evidence/
          cp data/intelligence/nic_regime_history.jsonl /tmp/nic-evidence/
          cp data/intelligence/nic_forecast_calibration.json /tmp/nic-evidence/
          cp data/intelligence/nic_forecast_champion.json /tmp/nic-evidence/
          cp data/intelligence/nic_forecast_governance.json /tmp/nic-evidence/
          cp data/intelligence/nic_signal_family_governance.json /tmp/nic-evidence/
          cp data/intelligence/nic_signal_attribution.json /tmp/nic-evidence/
          cp data/intelligence/nic_decision_outcome_ledger.jsonl /tmp/nic-evidence/ || true
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/nic-evidence/nic_forecast_laboratory.json data/live/
          cp /tmp/nic-evidence/nic_forecast_laboratory_report.json data/intelligence/
          cp /tmp/nic-evidence/nic_forecast_truth_ledger.jsonl data/intelligence/
          cp /tmp/nic-evidence/nic_forecast_outcome_events.jsonl data/intelligence/
          cp /tmp/nic-evidence/nic_signal_predictivity_matrix.json data/intelligence/
          cp /tmp/nic-evidence/nic_regime_history.jsonl data/intelligence/
          cp /tmp/nic-evidence/nic_forecast_calibration.json data/intelligence/
          cp /tmp/nic-evidence/nic_forecast_governance.json data/intelligence/
          cp /tmp/nic-evidence/nic_signal_family_governance.json data/intelligence/
          cp /tmp/nic-evidence/nic_signal_attribution.json data/intelligence/
          cp /tmp/nic-evidence/nic_decision_outcome_ledger.jsonl data/intelligence/ || true
          cp /tmp/nic-evidence/nic_forecast_champion.json data/intelligence/
          git add data/live/nic_forecast_laboratory.json data/intelligence/nic_forecast_laboratory_report.json data/intelligence/nic_forecast_truth_ledger.jsonl data/intelligence/nic_forecast_outcome_events.jsonl data/intelligence/nic_signal_predictivity_matrix.json data/intelligence/nic_regime_history.jsonl data/intelligence/nic_forecast_calibration.json data/intelligence/nic_forecast_champion.json data/intelligence/nic_forecast_governance.json data/intelligence/nic_signal_family_governance.json data/intelligence/nic_signal_attribution.json data/intelligence/nic_decision_outcome_ledger.jsonl
          git diff --cached --quiet && exit 0
          git commit -m "Record NIC Forecast Laboratory learning evidence"
          git push origin HEAD:main
