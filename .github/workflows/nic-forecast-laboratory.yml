name: NIC Forecast Laboratory
on:
  push:
    branches: [main]
    paths: ["src/nic_forecast_laboratory.py","src/nic_forecast_outcome_resolver.py","tests/test_nic_forecast_laboratory.py","tests/test_nic_forecast_outcome_resolver.py","src/nic_forecast_evidence_adapter.py","tests/test_nic_forecast_evidence_adapter.py",".github/workflows/nic-forecast-laboratory.yml","data/live/nic_prediction_engine.json"]
  workflow_dispatch:
concurrency:
  group: nic-forecast-laboratory-main
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  laboratory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m py_compile src/nic_forecast_laboratory.py src/nic_forecast_outcome_resolver.py tests/test_nic_forecast_laboratory.py tests/test_nic_forecast_outcome_resolver.py
      - run: python tests/test_nic_forecast_laboratory.py
      - run: python tests/test_nic_forecast_outcome_resolver.py
      - run: python tests/test_nic_forecast_evidence_adapter.py
      - run: python src/nic_forecast_laboratory.py
      - run: python src/nic_forecast_outcome_resolver.py
      - run: |
          python - <<'PY'
          import json
          d=json.load(open("data/live/nic_forecast_laboratory.json"))
          assert d["schema"]=="NIC-FORECAST-LAB-2.0"
          assert d["learning"]["walk_forward_validation"]
          assert d["learning"]["persistent_outcome_resolution"]
          assert d["policy"]["neutral_wait_allowed"]
          print("Forecast Laboratory learning validation: PASS")
          PY
      - name: Commit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live/nic_forecast_laboratory.json data/intelligence/nic_forecast_laboratory_report.json data/intelligence/nic_forecast_truth_ledger.jsonl data/intelligence/nic_signal_predictivity_matrix.json data/intelligence/nic_regime_history.jsonl
          git diff --cached --quiet || git commit -m "Record NIC Forecast Laboratory learning evidence"
          git pull --rebase --autostash origin main
          git push origin main || true
