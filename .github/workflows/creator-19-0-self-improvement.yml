name: Creator 19.0 - Self Improvement

on:
  schedule:
    - cron: '5 */6 * * *'
  workflow_dispatch:

concurrency:
  group: main-branch-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate code
        run: python -m compileall -q src
      - name: Run Creator 19.0
        run: python src/creator_19_0_self_improvement_v2.py
      - name: Validate artifacts
        run: |
          test -s data/live/creator_19_0_improvement_board.json
          test -s analytics/creator_19_0_improvement_memory.json
          test -s data/intelligence/creator_19_0_report.json
          python - <<'PY'
          import json
          from pathlib import Path
          for p in [Path('data/live/creator_19_0_improvement_board.json'),Path('analytics/creator_19_0_improvement_memory.json'),Path('data/intelligence/creator_19_0_report.json')]:
              json.loads(p.read_text(encoding='utf-8'))
          print('Creator 19.0 artifacts valid')
          PY
      - name: Persist state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/creator_19_0_self_improvement_v2.py .github/workflows/creator-19-0-self-improvement.yml data/live/creator_19_0_improvement_board.json analytics/creator_19_0_improvement_memory.json data/intelligence/creator_19_0_report.json analytics/strategy_memory.json
          if git diff --cached --quiet; then
            echo 'No Creator 19.0 changes to commit.'
            exit 0
          fi
          git commit -m 'chore: persist creator 19.0 self-improvement state'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
