name: Creator 17.0 - Active Knowledge Acquisition

on:
  schedule:
    - cron: '13 */3 * * *'
  workflow_dispatch:

concurrency:
  group: main-branch-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  active-research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate code
        run: python -m compileall -q src

      - name: Run active research
        run: python src/creator_17_0_active_research.py

      - name: Validate research artifacts
        run: |
          test -s data/live/creator_17_0_research_state.json
          test -s analytics/creator_17_0_knowledge_memory.json
          test -s data/intelligence/creator_17_0_report.json
          python - <<'PY'
          import json
          from pathlib import Path
          for p in [
              Path('data/live/creator_17_0_research_state.json'),
              Path('analytics/creator_17_0_knowledge_memory.json'),
              Path('data/intelligence/creator_17_0_report.json'),
          ]:
              json.loads(p.read_text(encoding='utf-8'))
          print('Creator 17.0 artifacts valid')
          PY

      - name: Persist state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/creator_17_0_active_research.py .github/workflows/creator-17-0-active-research.yml data/live/creator_17_0_research_state.json analytics/creator_17_0_knowledge_memory.json data/intelligence/creator_17_0_report.json analytics/strategy_memory.json
          if git diff --cached --quiet; then
            echo 'No Creator 17.0 changes to commit.'
            exit 0
          fi
          git commit -m 'chore: persist creator 17.0 active research state'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
