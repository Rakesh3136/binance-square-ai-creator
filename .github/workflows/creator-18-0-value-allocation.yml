name: Creator 18.0 - Evidence-Based Value Allocation

on:
  schedule:
    - cron: '29 */6 * * *'
  workflow_dispatch:

concurrency:
  group: main-branch-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  value-allocation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate code
        run: python -m compileall -q src
      - name: Run value allocator
        run: python src/creator_18_0_value_allocator.py
      - name: Validate artifacts
        run: |
          test -s analytics/creator_18_0_value_allocation.json
          test -s data/intelligence/creator_18_0_report.json
          python - <<'PY'
          import json
          from pathlib import Path
          for p in [Path('analytics/creator_18_0_value_allocation.json'), Path('data/intelligence/creator_18_0_report.json')]:
              json.loads(p.read_text(encoding='utf-8'))
          print('Creator 18.0 artifacts valid')
          PY
      - name: Persist state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/creator_18_0_value_allocator.py .github/workflows/creator-18-0-value-allocation.yml analytics/creator_18_0_value_allocation.json data/intelligence/creator_18_0_report.json analytics/strategy_memory.json
          if git diff --cached --quiet; then echo 'No Creator 18.0 changes to commit.'; exit 0; fi
          git commit -m 'chore: persist creator 18.0 value allocation state'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
