name: Creator 22.3 - Draft Intelligence

on:
  schedule:
    - cron: '29 */3 * * *'
  workflow_dispatch:

concurrency:
  group: main-branch-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build audience-aware draft brief
        run: python src/creator_22_3_draft_intelligence.py
      - name: Validate
        run: |
          python -m compileall -q src/creator_22_3_draft_intelligence.py
          python -m json.tool data/live/creator_22_3_draft_brief.json >/dev/null
      - name: Persist draft intelligence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/live/creator_22_3_draft_brief.json data/live/editorial_preflight.json
          git diff --cached --quiet || git commit -m 'chore: persist Creator 22.3 draft intelligence'
          git push
