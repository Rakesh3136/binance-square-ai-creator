name: NIC Forecast Evidence Reconciliation PR Checks

on:
  pull_request:
    paths:
      - 'src/nic_forecast_evidence_reconcile.py'
      - 'tests/test_nic_forecast_evidence_reconcile.py'
      - '.github/workflows/autonomous-market-creator.yml'
      - '.github/workflows/nic-forecast-evidence-reconcile-pr.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile reconciliation module
        run: python -m py_compile src/nic_forecast_evidence_reconcile.py
      - name: Run reconciliation unit tests
        run: python -m unittest discover -s tests -p 'test_nic_forecast_evidence_reconcile.py' -v
      - name: Check whitespace
        run: git diff --check
      - name: Assert editorial publishing is quality-gated and trading remains disabled
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path(".github/workflows/autonomous-market-creator.yml").read_text(encoding="utf-8")
          authorization = Path("src/nic_publication_authorization.py").read_text(encoding="utf-8")
          publisher = Path("src/binance_square_publisher.py").read_text(encoding="utf-8")
          assert "Final NIC 21 and editorial revalidation" in workflow
          assert "steps.publication_authorization.outputs.authorized == 'true'" in workflow
          assert "NIC_AUTO_PUBLICATION_MODE: EDITORIAL_ONLY" in workflow
          assert "trade_signal_publication_authorized" in authorization
          assert "live_orders_authorized" in authorization
          assert "verify_quality_authorization" in publisher
          print("Editorial publication requires quality authorization; live orders remain disabled.")
          PY
