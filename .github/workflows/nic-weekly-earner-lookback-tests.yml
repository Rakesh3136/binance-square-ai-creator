name: NIC Weekly Earner Lookback Tests

on:
  pull_request:
    paths:
      - 'src/nic_weekly_earner_study.py'
      - 'tests/test_nic_weekly_earner_lookback.py'
      - '.github/workflows/nic-weekly-earner-lookback-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'src/nic_weekly_earner_study.py'
      - 'tests/test_nic_weekly_earner_lookback.py'
      - '.github/workflows/nic-weekly-earner-lookback-tests.yml'

permissions:
  contents: read

jobs:
  lookback-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile weekly earner study
        run: python -m py_compile src/nic_weekly_earner_study.py
      - name: Test exact period and 14-day lookback separation
        run: python tests/test_nic_weekly_earner_lookback.py
