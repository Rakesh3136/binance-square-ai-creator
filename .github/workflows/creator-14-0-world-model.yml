name: Creator 14.0 — World Model & Knowledge Acquisition

on:
  schedule:
    - cron: '47 */3 * * *'
  workflow_dispatch:

concurrency:
  group: main-branch-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  world-model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build world model
        run: python src/creator_14_0_world_model.py

      - name: Validate world model artifacts
        run: |
          python -m json.tool analytics/creator_14_0_world_model.json >/dev/null
          python -m json.tool data/live/creator_14_0_knowledge_plan.json >/dev/null
          python -m json.tool data/intelligence/creator_14_0_report.json >/dev/null

      - name: Persist world model
        run: |
          git config user.name 'creator-14-0-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analytics/creator_14_0_world_model.json analytics/strategy_memory.json data/live/creator_14_0_knowledge_plan.json data/intelligence/creator_14_0_report.json
          git diff --cached --quiet || git commit -m 'chore: update creator 14.0 world model'
          git push origin main
