name: NIC — Agent Core

on:
  pull_request:
    paths:
      - "src/nic_agent_core.py"
      - "tests/test_nic_agent_core.py"
      - ".github/workflows/nic-agent-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-agent-core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and test agent core
        run: |
          set -euo pipefail
          python -m py_compile src/nic_agent_core.py
          PYTHONPATH=src python -m unittest discover -s tests -p "test_nic_agent_core.py" -v
