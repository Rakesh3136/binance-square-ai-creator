name: Creator 21.0 Human-Level Editorial Intelligence

on:
  schedule:
    - cron: '29 */3 * * *'
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: '1'

concurrency:
  group: main-branch-writer
  cancel-in-progress: false

jobs:
  editorial-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run human-level editorial intelligence
        run: python src/creator_21_0_human_level_editor.py
      - name: Validate generated state
        run: |
          python -m json.tool data/live/creator_21_0_editorial_state.json >/dev/null
          python -m json.tool data/intelligence/creator_21_0_report.json >/dev/null
      - name: Persist state
        run: |
          git config user.name 'binance-square-ai-creator'
          git config user.email 'actions@users.noreply.github.com'
          git add data/live/creator_21_0_editorial_state.json data/intelligence/creator_21_0_report.json
          git diff --cached --quiet || git commit -m 'Persist Creator 21.0 editorial intelligence'
          git push
