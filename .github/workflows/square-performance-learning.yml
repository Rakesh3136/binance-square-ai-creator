name: Square Performance Learning

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect Square performance
        run: python src/square_performance_collector.py
      - name: Run learning engine
        run: python src/learning_engine.py
      - name: Save performance memory
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analytics/square_performance.jsonl analytics/square_performance_state.json analytics/strategy_memory.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update Square performance learning data'
          git push
