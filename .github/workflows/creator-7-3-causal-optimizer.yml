name: Creator 7.3 Causal Strategy Optimization

on:
  schedule:
    - cron: '47 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-branch-writer
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run causal strategy optimizer
        run: python src/creator_7_3_causal_optimizer.py
      - name: Save causal learning state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analytics/creator_7_3_causal_effects.json analytics/creator_7_3_strategy.json analytics/strategy_memory.json data/intelligence/creator_7_3_report.json
          git diff --cached --quiet && exit 0
          git pull --rebase --autostash origin main
          git add analytics/creator_7_3_causal_effects.json analytics/creator_7_3_strategy.json analytics/strategy_memory.json data/intelligence/creator_7_3_report.json
          git diff --cached --quiet && exit 0
          git commit -m 'Optimize Creator 7.3 strategy from repeated experiments'
          git push origin main
