name: NIC 20 — Role Intelligence & Research

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "35 */6 * * *"

permissions:
  contents: write

jobs:
  role-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run NIC 20.1
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          python -m compileall -q src/nic_role_contract.py src/nic_task_compiler.py src/nic_question_understanding.py src/nic_research_orchestrator.py src/nic_evidence_registry.py src/nic_capability_gap.py src/nic_role_intelligence.py
          python src/nic_role_contract.py
          python src/nic_task_compiler.py
          python src/nic_question_understanding.py
          python src/nic_research_orchestrator.py
          python src/nic_evidence_registry.py
          python src/nic_capability_gap.py
          python src/nic_role_intelligence.py
          for f in data/live/nic_role_contract.json data/live/nic_task_plan.json data/live/nic_question_understanding.json data/live/nic_research_raw.json data/live/nic_evidence_registry.json data/live/nic_capability_gap.json data/live/nic_role_intelligence.json; do
            python -m json.tool "$f" >/dev/null
          done
      - name: Persist NIC state
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/live data/intelligence
          if git diff --cached --quiet; then
            echo "No NIC state changes."
            exit 0
          fi
          git commit -m 'Run NIC 20.1 role intelligence cycle'
          git pull --rebase --autostash origin main
          git push origin main
