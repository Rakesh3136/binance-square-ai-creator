name: NIC 20 — Role Intelligence & Task Solver

on:
  push:
    branches: [main]
    paths:
      - 'src/nic_role_*.py'
      - 'src/nic_task_compiler.py'
      - 'src/nic_capability_gap.py'\n      - 'src/nic_question_understanding.py'\n      - 'src/nic_research_orchestrator.py'\n      - 'src/nic_evidence_registry.py'\n      - 'data/live/nic_research_sources.json'
      - '.github/workflows/nic-20-role-intelligence.yml'
  workflow_dispatch:
  schedule:
    - cron: "35 */6 * * *"

permissions:
  contents: write

jobs:
  role-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build NIC 20 role intelligence
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          python -m compileall -q src/nic_role_contract.py src/nic_task_compiler.py src/nic_capability_gap.py src/nic_question_understanding.py src/nic_research_orchestrator.py src/nic_evidence_registry.py src/nic_role_intelligence.py
          python src/nic_role_contract.py
          python src/nic_task_compiler.py
          python src/nic_capability_gap.py
          python src/nic_role_intelligence.py
          python -m json.tool data/live/nic_role_contract.json >/dev/null
          python -m json.tool data/live/nic_task_plan.json >/dev/null
          python -m json.tool data/live/nic_capability_gap.json >/dev/null
          python -m json.tool data/live/nic_role_intelligence.json >/dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/live data/intelligence
          git diff --cached --quiet || git commit -m 'Run NIC 20 role intelligence cycle'
          git pull --rebase --autostash origin main
          git push origin main
