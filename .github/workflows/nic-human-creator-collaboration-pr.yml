name: NIC Human Creator Collaboration PR Checks
# Includes static safety tests for the two-stage review/resume workflow.

on:
  pull_request:
    branches: [main]
    paths:
      - "src/nic_human_creator_contribution_gate.py"
      - "src/nic_pending_human_review.py"
      - "tests/test_nic_pending_human_review.py"
      - "tests/test_nic_review_resume_workflow.py"
      - "tests/test_nic_human_creator_contribution_gate.py"
      - ".github/workflows/autonomous-market-creator.yml"
      - ".github/workflows/nic-human-creator-collaboration-pr.yml"
      - ".github/workflows/nic-human-review-approval-validation.yml"

permissions:
  contents: read

jobs:
  verify-human-contribution:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate workflow YAML syntax
        run: ruby -e 'require "yaml"; ARGV.each { |p| YAML.load_file(p); puts "#{p}: valid YAML" }' .github/workflows/autonomous-market-creator.yml .github/workflows/nic-human-review-approval-validation.yml
      - name: Compile gate
        run: python -m py_compile src/nic_human_creator_contribution_gate.py
      - name: Compile pending-review handoff
        run: python -m py_compile src/nic_pending_human_review.py
      - name: Test human review and anti-stale-draft rules
        run: |
          python tests/test_nic_human_creator_contribution_gate.py
          python tests/test_nic_pending_human_review.py
          python tests/test_nic_review_resume_workflow.py
