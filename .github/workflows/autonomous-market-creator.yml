name: Binance Square AI Creator 7.0

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: Optional topic; leave blank for autonomous selection
        required: false
        default: ''
        type: string
env:
  PYTHONUNBUFFERED: '1'

concurrency:
  group: autonomous-market-creator
  cancel-in-progress: false

jobs:
  create-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
      - name: Reset production cycle
        run: python src/pipeline_stage.py reset 'Fresh Creator 7.0 autonomous mission cycle'
      - name: Refresh live market
        run: python src/live_market_scanner.py
      - name: Refresh fresh crypto and macro news
        run: python src/news_scanner.py
      - name: Run creator intelligence
        run: python src/run_creator_intelligence.py
      - name: Run editorial preflight
        env:
          TOPIC: ${{ github.event.inputs.topic || '' }}
        run: |
          python src/editorial_preflight.py
          if [ -n "$TOPIC" ]; then python src/workflow_helpers.py manual-topic; fi
      - name: TradingView asset eligibility gate
        run: python src/tradingview_asset_gate.py
      - name: Refresh performance learning and engagement strategy
        run: |
          python src/signal_outcome_tracker.py
          python src/performance_feedback.py
          python src/creator_growth_system.py
          python src/living_brain.py
          python src/engagement_engine.py
      - name: Creator 7.0 Content Director - generate market-wide candidates
        run: python src/content_director_4.py
      - name: Creator 7.0 Opportunity Ranker - choose strongest opportunity
        run: python src/opportunity_ranker_6.py
      - name: Creator 6.5 Identity + Anti-Repetition - rotate story and voice
        run: python src/creator_identity_6.py
      - name: Creator 6.6 Authenticity + Learned Style - enforce human creator voice
        run: python src/creator_identity_6_6.py
      - name: Creator 7.0 Mission Brain - set seven-day economic objective and action
        run: python src/creator_mission_7.py
      - name: Creator 7.0 Adaptive Cadence - autonomous publish, wait, pivot or research
        id: cadence
        run: |
          python src/autonomous_cadence_6.py
          publish=$(python -c 'import json; print(str(json.load(open("data/live/autonomous_cadence_6.json")).get("publish", False)).lower())')
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Autonomous mission decision: $publish"
      - name: Freeze authoritative story and asset
        if: ${{ steps.cadence.outputs.publish == 'true' }}
        run: |
          python src/freeze_opportunity.py
          python src/pipeline_stage.py freeze success 'Creator 7.0 mission, ranked story, asset, identity and authenticity constraints frozen'
      - name: Creator 7.0 Brain - authoritative story decision
        if: ${{ steps.cadence.outputs.publish == 'true' }}
        run: |
          python src/creator_brain.py
          python src/creator_brain_gate.py
          python src/pipeline_stage.py creator_brain success 'Creator 7.0 Brain decision completed'
      - name: Creator 7.0 Script Director
        if: ${{ steps.cadence.outputs.publish == 'true' }}
        run: python src/script_director_4.py
      - name: Creator 7.0 Candidate Generation Brief
        if: ${{ steps.cadence.outputs.publish == 'true' }}
        run: python src/candidate_generation_4.py
      - name: Prepare publication context
        if: ${{ steps.cadence.outputs.publish == 'true' }}
        run: |
          python src/publication_context.py
          python src/self_repair_agent.py
          python src/editorial_prompt_patch.py
          python -m compileall -q src
      - name: Create AI draft
        if: ${{ steps.cadence.outputs.publish == 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          GEMINI_DAILY_BUDGET: '20'
          TOPIC: ${{ github.event.inputs.topic || '' }}
        run: |
          python src/safe_creator_runner.py
          python src/normalize_draft.py
          python src/technical_enricher.py
          python src/call_tracker.py
      - name: Improve draft with Creator Intelligence
        if: ${{ steps.cadence.outputs.publish == 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          GEMINI_DAILY_BUDGET: '20'
          TOPIC: ${{ github.event.inputs.topic || '' }}
        run: |
          set +e
          python src/creator_intelligence_2.py
          rc=$?
          if [ "$rc" = '3' ]; then python src/creator_rework.py; fi
          if [ "$rc" != '0' ]; then echo "Creator Intelligence exited with $rc; continuing with validated draft"; fi
          exit 0
      - name: Generate and score 7.0 candidate scripts
        if: ${{ steps.cadence.outputs.publish == 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          GEMINI_DAILY_BUDGET: '20'
        run: |
          python src/candidate_generation_4.py
          python src/candidate_script_scorer_4.py
      - name: Locate fresh draft
        if: ${{ steps.cadence.outputs.publish == 'true' }}
        id: draft
        run: |
          draft=$(find data/reports -type f -name '*-multi-agent.json' -mmin -30 -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)
          if [ -z "$draft" ]; then echo '::error::No fresh AI draft found'; exit 1; fi
          echo "path=$draft" >> "$GITHUB_OUTPUT"
      - name: Apply human editorial layer
        if: ${{ steps.cadence.outputs.publish == 'true' }}
        run: |
          DRAFT_PATH=$(find data/reports -type f -name '*-multi-agent.json' -mmin -30 -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)
          if [ -z "$DRAFT_PATH" ]; then echo '::error::No fresh AI draft found for editorial layer'; exit 1; fi
          DRAFT_PATH="$DRAFT_PATH" python src/human_editor.py
          python -m json.tool "$DRAFT_PATH" >/dev/null
      - name: Hard content integrity gate
        if: ${{ steps.cadence.outputs.publish == 'true' }}
        run: python src/content_integrity_gate_4.py
      - name: Setup Node and Playwright
        if: ${{ steps.cadence.outputs.publish == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium
        if: ${{ steps.cadence.outputs.publish == 'true' }}
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Render TradingView chart package
        if: ${{ steps.cadence.outputs.publish == 'true' }}
        run: |
          python src/visual_renderer.py
          test -s data/live/visual.png
          python src/pipeline_stage.py visual success 'TradingView visual package rendered'
      - name: Validate TradingView chart package
        if: ${{ steps.cadence.outputs.publish == 'true' }}
        run: |
          python src/validate_visual.py
          python src/validate_tradingview_visual.py data/live/visual.png
      - name: Run publication gate
        if: ${{ steps.cadence.outputs.publish == 'true' }}
        id: gate
        run: |
          set +e
          python src/production_manager.py
          rc=$?
          set -e
          if [ ! -f /tmp/publish_gate.json ]; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo 'mode=image' >> "$GITHUB_OUTPUT"
            exit "$rc"
          fi
          publish=$(python -c 'import json; print(str(json.load(open("/tmp/publish_gate.json")).get("publish", False)).lower())')
          mode=$(python -c 'import json; print(json.load(open("/tmp/publish_gate.json")).get("mode", "image"))')
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          if [ "$publish" = 'true' ]; then python src/pipeline_stage.py quality_gate success 'Publication authorized'; else python src/pipeline_stage.py quality_gate blocked 'Publication blocked by quality gate'; fi
          exit 0
      - name: Extract publication text
        if: ${{ steps.cadence.outputs.publish == 'true' && steps.gate.outputs.publish == 'true' }}
        env:
          DRAFT_PATH: ${{ steps.draft.outputs.path }}
        run: python src/workflow_helpers.py extract
      - name: Prepare article title
        if: ${{ steps.cadence.outputs.publish == 'true' && steps.gate.outputs.publish == 'true' && steps.gate.outputs.mode == 'article' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          ctx=json.loads(Path('data/live/publication_context.json').read_text())
          title=ctx.get('article_title') or ctx.get('news_title') or 'Crypto Market Update'
          Path('data/live/article_title.txt').write_text(title[:180],encoding='utf-8')
          PY
      - name: Final TradingView validation
        if: ${{ steps.cadence.outputs.publish == 'true' && steps.gate.outputs.publish == 'true' }}
        run: |
          test -s data/live/visual.png
          python src/validate_visual.py
          python src/validate_tradingview_visual.py data/live/visual.png
      - name: Download Binance Square publisher
        if: ${{ steps.cadence.outputs.publish == 'true' && steps.gate.outputs.publish == 'true' }}
        run: git clone --depth 1 https://github.com/binance/binance-skills-hub.git binance-skills-hub
      - name: Publish to Binance Square
        id: publish
        if: ${{ steps.cadence.outputs.publish == 'true' && steps.gate.outputs.publish == 'true' }}
        env:
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
        run: |
          set -o pipefail
          mode='${{ steps.gate.outputs.mode }}'
          if [ "$mode" = 'article' ]; then
            python src/pipeline_stage.py publish running 'Publishing verified TradingView article with cover'
            node binance-skills-hub/skills/binance/square-post/scripts/post-image.mjs --title "$(cat data/live/article_title.txt)" --cover data/live/visual.png --text "$(cat data/live/publish_text.txt)" 2>&1 | tee /tmp/publish-result.txt
          else
            python src/pipeline_stage.py publish running 'Publishing validated TradingView image post'
            node binance-skills-hub/skills/binance/square-post/scripts/post-image.mjs --images data/live/visual.png --text "$(cat data/live/publish_text.txt)" 2>&1 | tee /tmp/publish-result.txt
          fi
          grep -q '^ID:' /tmp/publish-result.txt
          python src/pipeline_stage.py publish success 'Binance Square returned a post ID'
          python src/pipeline_stage.py verify-publish
          echo 'verified=true' >> "$GITHUB_OUTPUT"
      - name: Record publication
        if: ${{ steps.cadence.outputs.publish == 'true' && steps.gate.outputs.publish == 'true' && steps.publish.outputs.verified == 'true' }}
        env:
          DRAFT_PATH: ${{ steps.draft.outputs.path }}
          MODE: ${{ steps.gate.outputs.mode }}
        run: python src/workflow_helpers.py record
      - name: Diagnostics
        if: always()
        run: |
          echo '=== PIPELINE STATUS ==='; test -f data/live/pipeline_status.json && cat data/live/pipeline_status.json || true
          echo '=== CREATOR 7.0 MISSION ==='; test -f data/live/creator_mission_7.json && cat data/live/creator_mission_7.json || true
          echo '=== AUTONOMOUS CADENCE 7.0 ==='; test -f data/live/autonomous_cadence_6.json && cat data/live/autonomous_cadence_6.json || true
          echo '=== NEWS SNAPSHOT ==='; test -f data/live/news_snapshot.json && cat data/live/news_snapshot.json || true
          echo '=== MARKET INTELLIGENCE 6.2 ==='; test -f data/live/market_intelligence_6.json && cat data/live/market_intelligence_6.json || true
          echo '=== OPPORTUNITY RANKING 6.3 ==='; test -f data/live/opportunity_ranking_6.json && cat data/live/opportunity_ranking_6.json || true
          echo '=== CREATOR IDENTITY 6.5 ==='; test -f data/live/creator_identity_6.json && cat data/live/creator_identity_6.json || true
          echo '=== CREATOR IDENTITY 6.6 ==='; test -f data/live/creator_identity_6_6.json && cat data/live/creator_identity_6_6.json || true
          echo '=== PUBLICATION CONTEXT ==='; test -f data/live/publication_context.json && cat data/live/publication_context.json || true
          echo '=== AUTHORITATIVE OPPORTUNITY ==='; test -f data/live/authoritative_opportunity.json && cat data/live/authoritative_opportunity.json || true
          echo '=== CREATOR BRAIN ==='; test -f data/live/creator_brain_decision.json && cat data/live/creator_brain_decision.json || true
          echo '=== PERFORMANCE FEEDBACK ==='; test -f data/intelligence/performance_feedback.json && cat data/intelligence/performance_feedback.json || true
          echo '=== PUBLICATION GATE ==='; test -f /tmp/publish_gate.json && cat /tmp/publish_gate.json || true
      - name: Persist state
        if: always()
        run: |
          set -e
          git restore --source=HEAD --staged --worktree src/ 2>/dev/null || true
          git clean -fd node_modules src/__pycache__ data/reports 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analytics data/live data/intelligence
          if git diff --cached --quiet; then
            echo 'No Creator state changes to persist.'
            exit 0
          fi
          git commit -m 'Record Creator 7.0 cycle'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
