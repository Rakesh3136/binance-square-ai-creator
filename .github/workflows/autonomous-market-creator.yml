name: Autonomous Market Creator

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional topic; leave blank for autonomous selection"
        required: false
        default: ""

env:
  PYTHONUNBUFFERED: "1"

concurrency:
  group: main-branch-writer
  cancel-in-progress: false

jobs:
  create-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Benchmark successful public Square creators
        run: |
          if python src/creator_benchmark.py; then
            python src/pipeline_stage.py creator_benchmark success "Updated public creator pattern intelligence"
          else
            python src/pipeline_stage.py creator_benchmark blocked "Creator benchmark unavailable; continue with existing intelligence"
          fi

      - name: Run full creator intelligence phases
        run: |
          if python src/run_creator_intelligence.py; then
            python src/pipeline_stage.py intelligence success "Audience, experiments, timing, visuals, thesis and evolution intelligence updated"
          else
            python src/pipeline_stage.py intelligence failed "Creator intelligence phase failed"
            exit 1
          fi

      - name: Run market and editorial preflight
        env:
          TOPIC: ${{ inputs.topic }}
        run: |
          python src/editorial_preflight.py
          if [ -n "$TOPIC" ]; then
            python -c "import json; from pathlib import Path; p=Path('data/live/editorial_preflight.json'); d=json.loads(p.read_text()); d=d if isinstance(d,dict) else {}; d['run_ai']=True; d['reason']='manual_topic'; p.write_text(json.dumps(d, indent=2))"
          fi

      - name: Select engagement experiment
        env:
          TOPIC: ${{ inputs.topic }}
        run: |
          if python src/engagement_engine.py; then
            python src/pipeline_stage.py select success "Opportunity lane selected"
          else
            python src/pipeline_stage.py select failed "Opportunity rotation failed"
            exit 1
          fi

      - name: Run Creator Brain
        run: |
          if python src/creator_brain.py; then
            python src/creator_brain_gate.py
            python src/pipeline_stage.py creator_brain success "Creator Brain decision wired into this production cycle"
          else
            python src/pipeline_stage.py creator_brain failed "Creator Brain failed"
            exit 1
          fi

      - name: Run AI only for a real opportunity
        if: ${{ hashFiles('data/live/editorial_preflight.json') != '' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          GEMINI_DAILY_BUDGET: "20"
          TOPIC: ${{ inputs.topic }}
        run: |
          RUN_AI=$(python -c "import json; print(str(json.load(open('data/live/editorial_preflight.json')).get('run_ai',False)).lower())")
          if [ "$RUN_AI" != "true" ]; then
            echo '{"status":"NO_OPPORTUNITY"}' > data/live/creator_status.json
            python src/pipeline_stage.py ai_draft blocked "No real opportunity passed preflight"
            exit 0
          fi
          python src/pipeline_stage.py ai_draft running "Generating fresh human-style draft using Creator Brain"
          if python src/safe_creator_runner.py; then
            STATUS=$(python -c "import json; print(json.load(open('data/live/creator_status.json')).get('status',''))")
            if [ "$STATUS" = "AI_SUCCESS" ] || [ "$STATUS" = "LOCAL_FALLBACK_SUCCESS" ]; then
              python src/pipeline_stage.py ai_draft success "Fresh draft generated using Creator Brain decision"
            else
              python src/pipeline_stage.py ai_draft blocked "$STATUS"
            fi
          else
            python src/pipeline_stage.py ai_draft failed "AI creator failed"
            exit 1
          fi

      - name: Render visual
        if: ${{ hashFiles('data/live/creator_status.json') != '' }}
        run: |
          STATUS=$(python -c "import json; print(json.load(open('data/live/creator_status.json')).get('status',''))")
          if [ "$STATUS" != "AI_SUCCESS" ] && [ "$STATUS" != "LOCAL_FALLBACK_SUCCESS" ]; then
            python src/pipeline_stage.py visual blocked "No fresh draft to render"
            exit 0
          fi
          python src/pipeline_stage.py visual running "Rendering real market visual"
          if python src/visual_renderer.py; then
            python src/pipeline_stage.py visual success "Visual rendering completed"
          else
            python src/pipeline_stage.py visual failed "Visual renderer failed"
            exit 1
          fi

      - name: Evaluate publication gate
        id: gate
        shell: bash
        run: |
          if python src/workflow_helpers.py gate; then
            PUBLISH=$(grep -E '^publish=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)
            if [ "$PUBLISH" = "true" ]; then
              python src/pipeline_stage.py quality_gate success "All publication quality and interaction gates passed"
            else
              python src/pipeline_stage.py quality_gate blocked "Publication gate rejected this draft"
            fi
          else
            python src/pipeline_stage.py quality_gate failed "Publication gate crashed"
            exit 1
          fi

      - name: Locate fresh draft
        if: ${{ steps.gate.outputs.publish == 'true' }}
        id: draft
        run: |
          DRAFT=$(find data/reports -type f -name '*multi-agent.json' -mmin -20 -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)
          test -n "$DRAFT" || (python src/pipeline_stage.py quality_gate failed "No fresh draft found after gate"; exit 1)
          echo "path=$DRAFT" >> "$GITHUB_OUTPUT"

      - name: Extract post
        if: ${{ steps.gate.outputs.publish == 'true' }}
        env:
          DRAFT_PATH: ${{ steps.draft.outputs.path }}
        run: python src/workflow_helpers.py extract

      - name: Setup Node
        if: ${{ steps.gate.outputs.publish == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download official Binance Square skill
        if: ${{ steps.gate.outputs.publish == 'true' }}
        run: git clone --depth 1 https://github.com/binance/binance-skills-hub.git binance-skills-hub

      - name: Publish image post
        if: ${{ steps.gate.outputs.publish == 'true' && steps.gate.outputs.mode == 'image' }}
        env:
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
        run: |
          python src/pipeline_stage.py publish running "Sending image post to Binance Square"
          python binance-skills-hub/skills/binance/square-post/scripts/post_image.py --file data/live/visual.png --text "$(cat data/live/publish_text.txt)"
          python src/pipeline_stage.py publish success "Image post submitted"

      - name: Publish text post
        if: ${{ steps.gate.outputs.publish == 'true' && steps.gate.outputs.mode == 'text' }}
        env:
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
        run: |
          python src/pipeline_stage.py publish running "Sending text post to Binance Square"
          python binance-skills-hub/skills/binance/square-post/scripts/post_text.py --text "$(cat data/live/publish_text.txt)"
          python src/pipeline_stage.py publish success "Text post submitted"

      - name: Record pipeline state
        if: always()
        run: python src/pipeline_stage.py finalize "Production cycle completed"

      - name: Persist strategy and pipeline state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics data/live data/intelligence
          git diff --cached --quiet || git commit -m "Record autonomous creator cycle"
          git pull --rebase --autostash origin main
          git push origin main || true
