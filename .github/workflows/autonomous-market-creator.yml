name: Binance Square AI Creator — Single Autonomous Orchestrator

on:
  push:
    branches: [main]
    paths:
      - '.github/creator-recovery.trigger'
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: Optional topic; leave blank for autonomous selection
        required: false
        default: ''
        type: string
      run_self_engineering:
        description: Run the guarded self-engineering diagnostic during a manual run
        required: false
        default: false
        type: boolean

env:
  PYTHONUNBUFFERED: '1'

concurrency:
  group: unified-binance-square-creator
  cancel-in-progress: false

jobs:
  creator:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
      actions: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject stale queued creator run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          current_main=$(git rev-parse origin/main)
          if [ "$GITHUB_SHA" != "$current_main" ]; then
            echo "Stale creator run detected: event=$GITHUB_SHA current_main=$current_main"
            gh run cancel "$GITHUB_RUN_ID" --repo "${{ github.repository }}" || true
            exit 0
          fi
          echo "Creator run is on current main: $current_main"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
      - name: Early code integrity check
        run: |
          python -m compileall -q src
          PYTHONPATH=src python -c "import signal_post_builder, signal_first_router, safe_creator_runner, autonomous_publish_recovery, production_manager, creator_8_4_monetization_feedback, revenue_content_director, jev_decision_gate, jev_runtime_gate, decision_ensemble_gate, nic_model_router, nic_core, global_macro_intelligence, cross_asset_impact_engine, creator_self_training_controller, content_master_router, autonomous_self_development_gate, monetization_funnel_optimizer, creator_series_engine"
          python src/nic_model_router.py
          echo 'Core, Jev, ensemble and NIC modules imported successfully'
      - name: Reset creator cycle
        run: python src/pipeline_stage.py reset 'Single-orchestrator autonomous creator cycle'
      - name: Refresh full market universe, flow, news and core intelligence
        run: |
          python src/live_market_scanner.py
          python src/full_universe_flow_scanner.py
          python src/full_universe_ranker_bridge.py
          python src/capital_flow_intelligence.py
          python src/news_scanner.py
          python src/global_macro_intelligence.py
          python src/cross_asset_impact_engine.py
          python -m json.tool data/live/global_macro_intelligence.json >/dev/null
          python -m json.tool data/live/cross_asset_impact.json >/dev/null
          python src/run_creator_intelligence.py
          python src/editorial_preflight.py
          python src/tradingview_asset_gate.py
        env:
          TOPIC: ${{ github.event.inputs.topic || '' }}
      - name: Measure previous publications and resolve prediction outcomes
        run: |
          python src/square_performance_collector.py
          python src/square_post_detail_collector.py
          python src/creator_24_1_prediction_outcomes.py
          python src/creator_24_0_unified_ledger.py
          python src/creator_7_2_learning.py
          python src/creator_7_2_strategy_bridge.py
          python src/learning_engine.py
          python src/creator_7_3_causal_optimizer.py
          python src/creator_7_4_adaptive_experiment_controller.py
          python src/creator_7_5_growth_portfolio.py
          python src/creator_8_0_revenue_engine.py
          python src/creator_8_4_monetization_feedback.py
          python src/monetization_funnel_optimizer.py
          python src/creator_series_engine.py
          python -m json.tool data/live/monetization_funnel_optimizer.json >/dev/null
          python -m json.tool data/live/creator_series_plan.json >/dev/null
          python src/revenue_content_director.py
          python -m json.tool data/live/creator_8_4_monetization_feedback.json >/dev/null
          python -m json.tool data/live/revenue_content_director.json >/dev/null
      - name: Publication truth and audience intelligence
        run: |
          python src/creator_20_0_publication_verifier.py
          python src/creator_22_0_audience_intelligence.py
          python src/creator_22_2_hook_format_intelligence.py
          python src/creator_22_3_draft_intelligence.py
      - name: Reliability, repair and autonomous reasoning layers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python src/market_regime_intelligence.py
          python src/creator_9_0_autonomous_brain.py
          python src/creator_10_0_reliability_guardian.py
          python src/creator_10_1_root_cause_repair.py
          python src/creator_11_0_continuous_improvement.py
          python src/creator_12_0_experiment_executor.py
          python src/creator_13_0_synthetic_self.py
          python src/creator_14_0_world_model.py
          python src/creator_15_0_opportunity_hunter.py
          python src/creator_16_0_counterfactual_engine.py
          python src/creator_17_0_active_research.py
          python src/original_research_engine.py
          python src/deep_coin_research_reporter.py
          python src/research_intelligence_layer.py
          python src/thesis_ledger.py
          python src/creator_18_0_value_allocator.py
          python src/creator_19_0_self_improvement_v2.py
          python src/content_master_training.py
          python -m json.tool data/live/content_master_training.json >/dev/null
          python -m json.tool data/intelligence/content_master_training_report.json >/dev/null
          python src/creator_self_training_controller.py
          python -m json.tool data/live/creator_self_training.json >/dev/null
          python -m json.tool data/intelligence/creator_self_training_report.json >/dev/null
          python src/content_master_router.py
          python -m json.tool data/live/content_master_route.json >/dev/null
      - name: NIC Dashboard Telemetry Summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = ["data/live/nic_core_state.json","data/live/nic_activity.jsonl"]
          for name in files:
              p=Path(name)
              print("NIC_TELEMETRY", name, "present=", p.exists(), "bytes=", p.stat().st_size if p.exists() else 0)
          if Path(files[0]).exists():
              s=json.loads(Path(files[0]).read_text())
              print("NIC_TELEMETRY_STATE", json.dumps({"symbol":s.get("symbol"),"direction":s.get("direction"),"evidence_score":s.get("evidence_score"),"hook_family":s.get("hook_family")}))
          PY
      - name: NIC Live Activity Snapshot
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          root=Path('.')
          state={
            "timestamp": datetime.now(timezone.utc).isoformat(),
            "run_id": os.getenv("GITHUB_RUN_ID",""),
            "run_number": os.getenv("GITHUB_RUN_NUMBER",""),
            "status": "ACTIVE",
            "stage": "nic_core",
            "event": "NIC autonomous cycle started",
          }
          p=root/"data/live/nic_activity.jsonl"
          p.parent.mkdir(parents=True,exist_ok=True)
          with p.open("a",encoding="utf-8") as f: f.write(json.dumps(state,ensure_ascii=False)+"\\n")
          print(json.dumps(state,indent=2))
          PY
      - name: Superhuman Creator Core
        run: |
          python src/superhuman_creator_core.py
          python src/nic_core.py
      - name: Build NIC cockpit telemetry
        run: |
          python src/nic_dashboard_state.py
          python -m json.tool data/live/nic_dashboard.json >/dev/null
      - name: Human-level editorial intelligence
        run: python src/creator_21_0_human_level_editor.py
      - name: Unified control-plane snapshot
        run: |
          python -m compileall -q src
          python -m json.tool data/live/original_research.json >/dev/null
          python -m json.tool data/intelligence/deep_coin_research_report.json >/dev/null
          python -m json.tool data/intelligence/thesis_ledger.json >/dev/null
          python src/creator_control_plane.py
          python src/creator_24_2_architecture_registry.py
          python -m json.tool data/live/creator_control_plane.json >/dev/null
          python -m json.tool data/intelligence/creator_control_plane_report.json >/dev/null
          python -m json.tool data/intelligence/creator_24_2_architecture.json >/dev/null
      - name: Bounded multi-agent supervisor
        run: |
          python src/creator_agent_supervisor.py
          python -m json.tool data/live/creator_agent_supervisor.json >/dev/null
          python -m json.tool data/live/agent_mesh_300.json >/dev/null
      - name: Autonomous self-development gate
        id: self_development
        run: |
          python src/autonomous_self_development_gate.py
          run_it=$(python -c 'import json; print(str(json.load(open("data/live/autonomous_self_development_gate.json")).get("run_self_engineer", False)).lower())')
          echo "run_self_engineer=$run_it" >> "$GITHUB_OUTPUT"
          echo "Autonomous self-development approved=$run_it"
      - name: Autonomous guarded self-engineering
        if: ${{ steps.self_development.outputs.run_self_engineer == 'true' }}
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python src/self_engineer.py
          test -f data/live/self_engineering_report.json || true
      - name: Optional guarded self-engineering
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_self_engineering == true }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python src/analytics_optimizer.py || true
          python src/creator_intelligence.py || true
          python src/self_engineer.py
          test -f data/live/self_engineering_report.json
      - name: Square-native creator style intelligence
        run: |
          python src/square_style_intelligence.py
          python -m json.tool data/intelligence/square_style_intelligence.json >/dev/null
      - name: Creator 7.x content director and adaptive cadence
        id: cadence
        run: |
          python src/revenue_content_director.py
          python src/content_director_4.py
          python src/opportunity_ranker_6.py
          python src/creator_identity_6.py
          python src/creator_identity_6_6.py
          python src/creator_mission_7.py
          python src/audience_growth_director.py
          python src/autonomous_cadence_6.py
          python src/market_regime_intelligence.py
          python src/pre_router_intelligence.py
          python src/signal_first_router.py
          publish=$(python -c 'import json; print(str(json.load(open("data/live/signal_first_routing.json")).get("publish", False)).lower())')
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Signal-first adaptive cadence decision: $publish"
      - name: Freeze opportunity and run authoritative brain
        if: ${{ steps.cadence.outputs.publish == 'true' }}
        run: |
          python src/freeze_opportunity.py
          python src/early_setup_gate.py
          python src/opportunity_contract_gate.py
          python src/adversarial_brain.py
          python src/decision_ensemble_gate.py
          python src/creator_brain.py
          python src/creator_brain_gate.py
          python src/pipeline_stage.py creator_brain success 'Authoritative creator brain completed'
      - name: Build and refine publishable content
        if: ${{ steps.cadence.outputs.publish == 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: claude-sonnet-5
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-6-astra
          NIC_EXTERNAL_MODELS: 'false'
          NIC_PROVIDER_ORDER: ''
          TOPIC: ${{ github.event.inputs.topic || '' }}
        run: |
          python src/script_director_4.py
          python src/publication_context.py
          python src/candidate_generation_4.py
          python src/self_repair_agent.py
          python src/editorial_prompt_patch.py
          python src/safe_creator_runner.py
          python src/normalize_draft.py
          python src/technical_enricher.py
          python src/creator_intelligence_2.py || true
      - name: Score scripts and apply human editorial pass
        id: editorial
        if: ${{ steps.cadence.outputs.publish == 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          GEMINI_DAILY_BUDGET: '20'
        run: |
          python src/candidate_script_scorer_4.py
          DRAFT_PATH=$(find data/reports -type f -name '*-multi-agent.json' -mmin -60 -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)
          test -n "$DRAFT_PATH"
          test -f "$DRAFT_PATH"
          echo "path=$DRAFT_PATH" >> "$GITHUB_OUTPUT"
          DRAFT_PATH="$DRAFT_PATH" python src/human_editor.py
          python -m json.tool "$DRAFT_PATH" >/dev/null
          blocked=$(python -c 'import json; print(str(json.load(open("data/live/editorial_polish.json")).get("status", "")).upper()=="BLOCKED")')
          echo "blocked=$blocked" >> "$GITHUB_OUTPUT"
          echo "Editorial blocked=$blocked"
      - name: Automatic news headline integrity repair
        if: ${{ steps.cadence.outputs.publish == 'true' && steps.editorial.outputs.blocked != 'true' }}
        env:
          DRAFT_PATH: ${{ steps.editorial.outputs.path }}
        run: python src/news_headline_integrity_repair.py
      - name: Automatic hook diversity repair
        if: ${{ steps.cadence.outputs.publish == 'true' && steps.editorial.outputs.blocked != 'true' }}
        env:
          DRAFT_PATH: ${{ steps.editorial.outputs.path }}
        run: python src/hook_diversity_rewriter.py
      - name: Automatic mechanism and reader-value repair
        if: ${{ steps.cadence.outputs.publish == 'true' && steps.editorial.outputs.blocked != 'true' }}
        env:
          DRAFT_PATH: ${{ steps.editorial.outputs.path }}
        run: python src/mechanism_value_rewriter.py
      - name: Activate Jev second-opinion gate
        id: jev
        continue-on-error: true
        if: ${{ steps.cadence.outputs.publish == 'true' && steps.editorial.outputs.blocked != 'true' }}
        env:
          DRAFT_PATH: ${{ steps.editorial.outputs.path }}
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
        run: python src/jev_runtime_gate.py
      - name: Elite pre-publication judge
        id: elite_judge
        continue-on-error: true
        if: ${{ steps.cadence.outputs.publish == 'true' && steps.editorial.outputs.blocked != 'true' && steps.jev.outcome == 'success' }}
        env:
          DRAFT_PATH: ${{ steps.editorial.outputs.path }}
        run: python src/elite_prepublication_judge.py
      - name: Recover rejected draft in the SAME creator cycle
        id: elite_recovery
        continue-on-error: true
        if: ${{ always() && steps.cadence.outputs.publish == 'true' && steps.editorial.outputs.blocked != 'true' && steps.jev.outcome == 'success' && steps.elite_judge.outcome == 'failure' }}
        env:
          DRAFT_PATH: ${{ steps.editorial.outputs.path }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          GEMINI_DAILY_BUDGET: '20'
        run: |
          python src/autonomous_publish_recovery.py
          echo 'Bounded recovery finished; the authoritative judge remains the final publication authority.'
      - name: Apply authoritative elite pre-publication gate
        id: elite_gate
        if: ${{ always() && steps.cadence.outputs.publish == 'true' && steps.editorial.outputs.blocked != 'true' && steps.jev.outcome == 'success' }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('data/live/elite_prepublication_judge.json')
          blocked = True; reason = 'elite_judge_output_missing'
          if path.exists():
              try: result = json.loads(path.read_text(encoding='utf-8'))
              except Exception: result = {}; reason = 'elite_judge_output_invalid_json'
              else:
                  failures = result.get('failures') or []
                  blocked = result.get('publish') is not True or bool(failures)
                  reason = ','.join(str(x) for x in failures) or 'publish'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f"blocked={'true' if blocked else 'false'}\n")
              f.write(f"reason={reason}\n")
          print({'blocked': blocked, 'reason': reason})
          if blocked: print('No publication: authoritative quality gate remains blocked after bounded recovery.')
          PY
      - name: Integrity and final content gates
        if: ${{ steps.cadence.outputs.publish == 'true' && steps.editorial.outputs.blocked != 'true' && steps.jev.outcome == 'success' && steps.elite_gate.outputs.blocked != 'true' }}
        env:
          DRAFT_PATH: ${{ steps.editorial.outputs.path }}
        run: |
          python src/content_integrity_gate_4.py
          python -m compileall -q src
      - name: Decide whether this lane needs a visual
        id: visual_mode
        if: ${{ steps.cadence.outputs.publish == 'true' && steps.editorial.outputs.blocked != 'true' && steps.jev.outcome == 'success' && steps.elite_gate.outputs.blocked != 'true' }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('data/live/publication_context.json'); ctx=json.loads(p.read_text()) if p.exists() else {}
          cat=str(ctx.get('category','')).lower(); meme=cat == 'crypto_meme'; required=meme or cat not in {'education','commentary','community'}; mode='meme' if meme else 'tradingview'
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write(f"required={'true' if required else 'false'}\n"); f.write(f"mode={mode}\n")
          print({'category':cat,'visual_required':required,'mode':mode})
          PY
      - name: Setup Node and Chromium
        if: ${{ steps.visual_mode.outputs.required == 'true' && steps.visual_mode.outputs.mode == 'tradingview' && steps.elite_gate.outputs.blocked != 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Render visual package
        if: ${{ steps.visual_mode.outputs.required == 'true' && steps.elite_gate.outputs.blocked != 'true' }}
        env:
          DRAFT_PATH: ${{ steps.editorial.outputs.path }}
        run: |
          if [ "${{ steps.visual_mode.outputs.mode }}" = "meme" ]; then python src/visual_renderer.py; else npm install --no-save playwright; npx playwright install --with-deps chromium; python src/visual_renderer.py; fi
          test -s data/live/visual.png
          python src/validate_visual.py
          provider=$(python -c 'import json; p=json.load(open("data/live/visual_metadata.json")); print(p.get("provider",""))')
          if [ "$provider" = "TradingView" ]; then python src/validate_tradingview_visual.py data/live/visual.png; fi
          python src/pipeline_stage.py visual success 'Professional visual package rendered and validated'
      - name: Final production gate
        id: production
        if: ${{ steps.cadence.outputs.publish == 'true' && steps.editorial.outputs.blocked != 'true' && steps.jev.outcome == 'success' && steps.elite_gate.outputs.blocked != 'true' }}
        env:
          DRAFT_PATH: ${{ steps.editorial.outputs.path }}
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
        run: |
          python src/production_manager.py
          publish=$(python -c 'import json; print(str(json.load(open("data/live/production_decision.json")).get("publish", False)).lower())')
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Final production decision: $publish"
      - name: Extract publication and submit to Binance Square
        if: ${{ steps.production.outputs.publish == 'true' && steps.elite_gate.outputs.blocked != 'true' && steps.jev.outcome == 'success' }}
        env:
          DRAFT_PATH: ${{ steps.editorial.outputs.path }}
          BINANCE_SQUARE_API_KEY: ${{ secrets.BINANCE_SQUARE_API_KEY }}
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
        run: |
          python src/extract_publication.py
          python src/write_to_earn_eligibility_gate.py
          python src/write_to_earn_master.py
          python -m json.tool data/live/write_to_earn_master.json >/dev/null
          python src/binance_square_publisher.py
          python src/creator_20_0_publication_verifier.py
          python src/call_tracker.py
          python src/creator_8_0_revenue_engine.py
      - name: Persist run state and diagnostics
        if: ${{ always() }}
        run: |
          if [ "${{ job.status }}" = "cancelled" ]; then echo 'Run cancelled; skipping repository state persistence.'; exit 0; fi
          if [ -f src/creator_diagnostics.py ]; then python src/creator_diagnostics.py || true; else echo 'creator_diagnostics.py not present; skipping legacy diagnostics hook'; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Another workflow (NIC learning/calibration/feedback) can legitimately push
          # main while this long creator cycle is still running. Preserve this cycle's
          # generated state, rebase it onto the newest main, then retry the push instead
          # of turning a harmless branch race into a red creator run.
          for attempt in 1 2 3; do
            echo "Persistence attempt $attempt/3"
            git fetch origin main
            git reset --mixed origin/main
            git add analytics data
            bad_paths=$(git diff --cached --name-only | grep -vE '^(analytics|data)/' || true)
            if [ -n "$bad_paths" ]; then
              echo '::error::Refusing to persist non-generated paths:'
              echo "$bad_paths"
              git reset
              exit 1
            fi
            if git diff --cached --quiet; then
              echo 'No generated state changes to persist'
              exit 0
            fi
            git commit -m 'Record Creator 7.x cycle'
            if git pull --rebase --autostash origin main; then
              if git push origin HEAD:main; then
                echo "Generated state persisted successfully on attempt $attempt"
                exit 0
              fi
            else
              echo "Rebase failed on attempt $attempt; aborting rebase and retrying from latest main"
              git rebase --abort || true
            fi
            echo "Main moved during persistence; retrying with latest origin/main"
          done
          echo '::error::Unable to persist generated creator state after 3 synchronized attempts'
          exit 1
