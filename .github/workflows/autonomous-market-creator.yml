name: Autonomous Market Creator
on:
  schedule:
    - cron: '7 */3 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/autonomous-market-creator.yml'
      - 'requirements.txt'
      - 'src/visual_renderer.py'
      - 'src/tradingview_renderer.mjs'
      - 'src/validate_visual.py'
      - 'src/normalize_draft.py'
      - 'src/degrade_visual.py'
      - 'src/publication_context.py'
      - 'src/performance_feedback.py'
      - 'src/creator_brain.py'
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional topic; leave blank for autonomous selection"
        required: false
        default: ""
env:
  PYTHONUNBUFFERED: "1"
concurrency:
  group: autonomous-market-creator
  cancel-in-progress: false
jobs:
  create-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reset production cycle state
        run: python src/pipeline_stage.py reset "Fresh autonomous production cycle"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
      - name: Verify production dependencies
        run: |
          python -c 'import importlib.util,sys; required=["google.genai","matplotlib","pandas","numpy"]; missing=[name for name in required if importlib.util.find_spec(name) is None]; sys.exit("Missing production dependencies: "+", ".join(missing)) if missing else print("All production dependencies OK")'
      - name: Benchmark successful public Square creators
        run: python src/creator_benchmark.py || true
      - name: Run full creator intelligence phases
        run: python src/run_creator_intelligence.py
      - name: Run market and editorial preflight
        env:
          TOPIC: ${{ inputs.topic }}
        run: |
          python src/editorial_preflight.py
          if [ -n "$TOPIC" ]; then
            python src/workflow_helpers.py manual-topic
          fi
      - name: Select engagement experiment
        run: python src/engagement_engine.py
      - name: Update performance feedback
        run: python src/performance_feedback.py
      - name: Run Creator Brain
        run: |
          python src/creator_brain.py
          python src/creator_brain_gate.py
          python src/pipeline_stage.py creator_brain success "Creator Brain decision wired into this production cycle"
      - name: Lock publication context
        run: python src/publication_context.py
      - name: Run AI creator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          GEMINI_DAILY_BUDGET: "20"
          TOPIC: ${{ inputs.topic }}
        run: |
          RUN_AI=$(python -c "import json; print(str(json.load(open('data/live/editorial_preflight.json')).get('run_ai',False)).lower())")
          if [ "$RUN_AI" != "true" ]; then
            echo '{"status":"NO_OPPORTUNITY"}' > data/live/creator_status.json
            python src/pipeline_stage.py ai_draft blocked "No real opportunity passed preflight"
            exit 0
          fi
          python src/safe_creator_runner.py
          python src/normalize_draft.py
          python src/pipeline_stage.py ai_draft success "Fresh draft generated and normalized"
      - name: Run Creator Intelligence 2.0 self-editor and one AI rework
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          GEMINI_DAILY_BUDGET: "20"
          TOPIC: ${{ inputs.topic }}
        run: |
          set +e
          python src/creator_intelligence_2.py
          RC=$?
          set -e
          if [ "$RC" = "3" ]; then
            echo "Creator Intelligence 2.0 rejected the first draft. Performing one fresh AI rewrite using the rejection reasons."
            python src/creator_rework.py
            python src/safe_creator_runner.py
            python src/normalize_draft.py
            python src/creator_intelligence_2.py
          elif [ "$RC" != "0" ]; then
            echo "Creator Intelligence 2.0 failed safely with exit code $RC; publication gate remains authoritative."
          else
            echo "Creator Intelligence 2.0 accepted the first draft for publication review."
          fi
      - name: Setup Node for TradingView renderer
        if: ${{ always() }}
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright Chromium for TradingView snapshot
        if: ${{ always() }}
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Render TradingView visual
        run: |
          STATUS=$(python -c "import json; print(json.load(open('data/live/creator_status.json')).get('status',''))")
          if [ "$STATUS" != "AI_SUCCESS" ] && [ "$STATUS" != "LOCAL_FALLBACK_SUCCESS" ]; then
            python src/pipeline_stage.py visual blocked "No fresh draft"
            exit 0
          fi
          python src/visual_renderer.py
          python src/pipeline_stage.py visual success "Official TradingView chart snapshot rendered"
      - name: Validate TradingView visual matches post
        run: |
          python src/validate_visual.py
          python src/pipeline_stage.py visual success "TradingView chart symbol matches the post"
      - name: Evaluate publication gate and rescue once if needed
        id: gate
        run: |
          python src/workflow_helpers.py gate
          PUBLISH=$(grep -E '^publish=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)
          if [ "$PUBLISH" != "true" ]; then
            echo "Publication gate rejected the first draft. Building deterministic publish rescue from verified market data."
            python src/publish_rescue.py
            python src/workflow_helpers.py gate
            PUBLISH=$(grep -E '^publish=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)
          fi
          if [ "$PUBLISH" = "true" ]; then
            python src/pipeline_stage.py quality_gate success "Publication gate passed or rescue succeeded"
          else
            python src/pipeline_stage.py quality_gate blocked "Publication gate and deterministic rescue both rejected the cycle"
            cat /tmp/publish_gate.json || true
            cat data/live/engagement_gate.json || true
            cat data/live/creator_intelligence_2.json || true
            exit 1
          fi
      - name: Locate fresh draft
        if: ${{ steps.gate.outputs.publish == 'true' }}
        id: draft
        run: |
          DRAFT=$(find data/reports -type f -name '*-multi-agent.json' -mmin -20 -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)
          test -n "$DRAFT"
          echo "path=$DRAFT" >> "$GITHUB_OUTPUT"
      - name: Extract post text
        if: ${{ steps.gate.outputs.publish == 'true' }}
        env:
          DRAFT_PATH: ${{ steps.draft.outputs.path }}
        run: python src/workflow_helpers.py extract
      - name: Download official Binance Square skill
        if: ${{ steps.gate.outputs.publish == 'true' }}
        run: git clone --depth 1 https://github.com/binance/binance-skills-hub.git binance-skills-hub
      - name: Publish image post
        if: ${{ steps.gate.outputs.publish == 'true' && steps.gate.outputs.mode == 'image' }}
        env:
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
        run: |
          python src/pipeline_stage.py publish running "Publishing TradingView image to Binance Square"
          node binance-skills-hub/skills/binance/square-post/scripts/post-image.mjs --images data/live/visual.png --text "$(cat data/live/publish_text.txt)" 2>&1 | tee /tmp/publish-result.txt
          grep -q '^ID:' /tmp/publish-result.txt
          python src/pipeline_stage.py publish success "Binance publisher returned a post result"
          python src/pipeline_stage.py verify-publish
      - name: Publish text post
        if: ${{ steps.gate.outputs.publish == 'true' && steps.gate.outputs.mode == 'text' }}
        env:
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
        run: |
          python src/pipeline_stage.py publish running "Publishing text to Binance Square"
          node binance-skills-hub/skills/binance/square-post/scripts/post-text.mjs --text "$(cat data/live/publish_text.txt)" 2>&1 | tee /tmp/publish-result.txt
          grep -q '^ID:' /tmp/publish-result.txt
          python src/pipeline_stage.py publish success "Binance publisher returned a post result"
          python src/pipeline_stage.py verify-publish
      - name: Record publication
        if: ${{ steps.gate.outputs.publish == 'true' }}
        env:
          DRAFT_PATH: ${{ steps.draft.outputs.path }}
          MODE: ${{ steps.gate.outputs.mode }}
        run: python src/workflow_helpers.py record
      - name: Finalize
        if: always()
        run: |
          if [ "${{ steps.gate.outputs.publish }}" = "true" ]; then
            python src/pipeline_stage.py finalize success "Production cycle completed and publication verified"
          else
            python src/pipeline_stage.py finalize blocked "Production cycle ended without a verified Binance Square publication"
            exit 1
          fi
      - name: Persist state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics data/live data/intelligence
          git diff --cached --quiet || git commit -m "Record autonomous creator cycle"
          git pull --rebase --autostash origin main
          git push origin main || true
