name: Binance Square AI Creator — Single Autonomous Orchestrator

on:
  schedule:
    - cron: '17 * * * *'
  push:
    branches:
      - main
    paths-ignore:
      - 'analytics/**'
      - 'data/**'
  workflow_dispatch:
    inputs:
      topic:
        description: Optional topic; leave blank for autonomous selection
        required: false
        default: ''
        type: string
      run_self_engineering:
        description: Run the guarded self-engineering diagnostic during a manual run
        required: false
        default: false
        type: boolean

env:
  PYTHONUNBUFFERED: '1'

concurrency:
  group: unified-binance-square-creator
  cancel-in-progress: true

jobs:
  creator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
      - name: Reset creator cycle
        run: python src/pipeline_stage.py reset 'Single-orchestrator autonomous creator cycle'
      - name: Refresh full market universe, flow, news and core intelligence
        run: |
          python src/live_market_scanner.py
          python src/full_universe_flow_scanner.py
          python src/full_universe_ranker_bridge.py
          python src/capital_flow_intelligence.py
          python src/news_scanner.py
          python src/run_creator_intelligence.py
          python src/editorial_preflight.py
          python src/tradingview_asset_gate.py
        env:
          TOPIC: ${{ github.event.inputs.topic || '' }}
      - name: Measure previous publications and resolve prediction outcomes
        run: |
          python src/square_performance_collector.py
          python src/creator_24_1_prediction_outcomes.py
          python src/creator_24_0_unified_ledger.py
          python src/creator_7_2_learning.py
          python src/creator_7_2_strategy_bridge.py
          python src/learning_engine.py
          python src/creator_7_3_causal_optimizer.py
          python src/creator_7_4_adaptive_experiment_controller.py
          python src/creator_7_5_growth_portfolio.py
          python src/creator_8_0_revenue_engine.py
      - name: Publication truth and audience intelligence
        run: |
          python src/creator_20_0_publication_verifier.py
          python src/creator_22_0_audience_intelligence.py
          python src/creator_22_2_hook_format_intelligence.py
          python src/creator_22_3_draft_intelligence.py
      - name: Reliability, repair and autonomous reasoning layers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python src/creator_9_0_autonomous_brain.py
          python src/creator_10_0_reliability_guardian.py
          python src/creator_10_1_root_cause_repair.py
          python src/creator_11_0_continuous_improvement.py
          python src/creator_12_0_experiment_executor.py
          python src/creator_13_0_synthetic_self.py
          python src/creator_14_0_world_model.py
          python src/creator_15_0_opportunity_hunter.py
          python src/creator_16_0_counterfactual_engine.py
          python src/creator_17_0_active_research.py
          python src/original_research_engine.py
          python src/deep_coin_research_reporter.py
          python src/research_intelligence_layer.py
          python src/thesis_ledger.py
          python src/creator_18_0_value_allocator.py
          python src/creator_19_0_self_improvement_v2.py
      - name: Superhuman Creator Core
        run: python src/superhuman_creator_core.py
      - name: Human-level editorial intelligence
        run: python src/creator_21_0_human_level_editor.py
      - name: Unified control-plane snapshot
        run: |
          python -m compileall -q src
          python -m json.tool data/live/original_research.json >/dev/null
          python -m json.tool data/intelligence/deep_coin_research_report.json >/dev/null
          python -m json.tool data/intelligence/thesis_ledger.json >/dev/null
          python src/creator_control_plane.py
          python src/creator_24_2_architecture_registry.py
          python -m json.tool data/live/creator_control_plane.json >/dev/null
          python -m json.tool data/intelligence/creator_control_plane_report.json >/dev/null
          python -m json.tool data/intelligence/creator_24_2_architecture.json >/dev/null
      - name: Bounded multi-agent supervisor
        run: |
          python src/creator_agent_supervisor.py
          python -m json.tool data/live/creator_agent_supervisor.json >/dev/null
      - name: Optional guarded self-engineering
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_self_engineering == true }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python src/analytics_optimizer.py || true
          python src/creator_intelligence.py || true
          python src/self_engineer.py
          test -f data/live/self_engineering_report.json
      - name: Square-native creator style intelligence
        run: |
          python src/square_style_intelligence.py
          python -m json.tool data/intelligence/square_style_intelligence.json >/dev/null
      - name: Creator 7.x content director and adaptive cadence
        id: cadence
        run: |
          python src/content_director_4.py
          python src/opportunity_ranker_6.py
          python src/creator_identity_6.py
          python src/creator_identity_6_6.py
          python src/creator_mission_7.py
          python src/audience_growth_director.py
          python src/autonomous_cadence_6.py
          publish=$(python -c 'import json; print(str(json.load(open("data/live/autonomous_cadence_6.json")).get("publish", False)).lower())')
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Human-like adaptive cadence decision: $publish"
      - name: Freeze opportunity and run authoritative brain
        if: ${{ steps.cadence.outputs.publish == 'true' }}
        run: |
          python src/freeze_opportunity.py
          python src/early_setup_gate.py
          python src/opportunity_contract_gate.py
          python src/creator_brain.py
          python src/creator_brain_gate.py
          python src/pipeline_stage.py creator_brain success 'Authoritative creator brain completed'
      - name: Build and refine publishable content
        if: ${{ steps.cadence.outputs.publish == 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          GEMINI_DAILY_BUDGET: '20'
          TOPIC: ${{ github.event.inputs.topic || '' }}
        run: |
          python src/script_director_4.py
          # Lock the current frozen opportunity BEFORE candidate generation.
          # Candidate generation and the agent supervisor must consume the same
          # publication identity that was selected by this cycle, not stale context.
          python src/publication_context.py
          python src/candidate_generation_4.py
          python src/self_repair_agent.py
          python src/editorial_prompt_patch.py
          python src/safe_creator_runner.py
          python src/normalize_draft.py
          python src/technical_enricher.py
          python src/creator_intelligence_2.py || true
      - name: Score scripts and apply human editorial pass
        id: editorial
        if: ${{ steps.cadence.outputs.publish == 'true' && steps.editorial.outputs.blocked != 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          GEMINI_DAILY_BUDGET: '20'
        run: |
          python src/candidate_script_scorer_4.py
          DRAFT_PATH=$(find data/reports -type f -name '*-multi-agent.json' -mmin -60 -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)
          test -n "$DRAFT_PATH"
          test -f "$DRAFT_PATH"
          echo "path=$DRAFT_PATH" >> "$GITHUB_OUTPUT"
          echo "path=$DRAFT_PATH"
          echo "Pinned editorial draft: $DRAFT_PATH"
          DRAFT_PATH="$DRAFT_PATH" python src/human_editor.py
          python -m json.tool "$DRAFT_PATH" >/dev/null
          blocked=$(python -c 'import json; print(str(json.load(open("data/live/editorial_polish.json")).get("status", "")).upper()=="BLOCKED")')
          echo "blocked=$blocked" >> "$GITHUB_OUTPUT"
          echo "Editorial blocked=$blocked"
      - name: Automatic news headline integrity repair
        if: ${{ steps.cadence.outputs.publish == 'true' && steps.editorial.outputs.blocked != 'true' }}
        env:
          DRAFT_PATH: ${{ steps.editorial.outputs.path }}
        run: python src/news_headline_integrity_repair.py
      - name: Automatic hook diversity repair
        if: ${{ steps.cadence.outputs.publish == 'true' && steps.editorial.outputs.blocked != 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          GEMINI_DAILY_BUDGET: '20'
          DRAFT_PATH: ${{ steps.editorial.outputs.path }}
        run: python src/hook_diversity_rewriter.py
      - name: Automatic mechanism and reader-value repair
        if: ${{ steps.cadence.outputs.publish == 'true' && steps.editorial.outputs.blocked != 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          GEMINI_DAILY_BUDGET: '20'
          DRAFT_PATH: ${{ steps.editorial.outputs.path }}
        run: python src/mechanism_value_rewriter.py
      - name: Elite pre-publication judge
        if: ${{ steps.cadence.outputs.publish == 'true' && steps.editorial.outputs.blocked != 'true' }}
        env:
          DRAFT_PATH: ${{ steps.editorial.outputs.path }}
        run: python src/elite_prepublication_judge.py
      - name: Integrity and final content gates
        if: ${{ steps.cadence.outputs.publish == 'true' && steps.editorial.outputs.blocked != 'true' }}
        env:
          DRAFT_PATH: ${{ steps.editorial.outputs.path }}
        run: |
          python src/content_integrity_gate_4.py
          python -m compileall -q src
      - name: Decide whether this lane needs a visual
        id: visual_mode
        if: ${{ steps.cadence.outputs.publish == 'true' && steps.editorial.outputs.blocked != 'true' }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('data/live/publication_context.json')
          ctx=json.loads(p.read_text()) if p.exists() else {}
          cat=str(ctx.get('category','')).lower()
          meme=cat == 'crypto_meme'
          required = meme or cat not in {'education','commentary','community'}
          mode = 'meme' if meme else 'tradingview'
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write(f"required={'true' if required else 'false'}\n")
              f.write(f"mode={mode}\n")
          print({'category':cat,'visual_required':required,'mode':mode})
          PY
      - name: Setup Node and Chromium
        if: ${{ steps.visual_mode.outputs.required == 'true' && steps.visual_mode.outputs.mode == 'tradingview' }}
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Render visual package
        if: ${{ steps.visual_mode.outputs.required == 'true' }}
        env:
          DRAFT_PATH: ${{ steps.editorial.outputs.path }}
        run: |
          if [ "${{ steps.visual_mode.outputs.mode }}" = "meme" ]; then
            python src/meme_renderer.py
          else
            npm install --no-save playwright
            npx playwright install --with-deps chromium
            node src/tradingview_renderer.mjs
          fi
          test -s data/live/visual.png
          python src/validate_visual.py
          if [ "${{ steps.visual_mode.outputs.mode }}" = "tradingview" ]; then python src/validate_tradingview_visual.py data/live/visual.png; fi
          python src/pipeline_stage.py visual success 'Professional visual package rendered and validated'
      - name: Final production gate
        id: production
        if: ${{ steps.cadence.outputs.publish == 'true' && steps.editorial.outputs.blocked != 'true' }}
        env:
          DRAFT_PATH: ${{ steps.editorial.outputs.path }}
        run: |
          python src/production_manager.py
          publish=$(python -c 'import json; print(str(json.load(open("data/live/production_decision.json")).get("publish", False)).lower())')
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Final production decision: $publish"
      - name: Extract publication and submit to Binance Square
        if: ${{ steps.production.outputs.publish == 'true' }}
        env:
          DRAFT_PATH: ${{ steps.editorial.outputs.path }}
          # Support both historical and current Binance Square OpenAPI secret names.
          BINANCE_SQUARE_API_KEY: ${{ secrets.BINANCE_SQUARE_API_KEY }}
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
        run: |
          python src/extract_publication.py
          python src/binance_square_publisher.py
          python src/creator_20_0_publication_verifier.py
          python src/call_tracker.py
          python src/creator_8_0_revenue_engine.py
      - name: Persist run state and diagnostics
        if: ${{ always() }}
        run: |
          if [ -f src/creator_diagnostics.py ]; then
            python src/creator_diagnostics.py || true
          else
            echo 'creator_diagnostics.py not present; skipping legacy diagnostics hook'
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Re-anchor the working tree to the newest main before staging generated state.
          # This avoids rebasing a large generated-data commit after another cycle advanced main.
          git fetch origin main
          git reset --mixed origin/main
          git add analytics data
          if git diff --cached --quiet; then
            echo 'No generated state changes to persist'
          else
            git commit -m 'Record Creator 7.x cycle'
            git push origin HEAD:main
          fi
