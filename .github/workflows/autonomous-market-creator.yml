name: Autonomous Market Creator
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional topic; leave blank for autonomous selection"
        required: false
        default: ""
env:
  PYTHONUNBUFFERED: "1"
concurrency:
  group: main-branch-writer
  cancel-in-progress: false
jobs:
  create-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reset production cycle state
        run: python src/pipeline_stage.py reset "Fresh autonomous production cycle"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
      - name: Verify production dependencies
        run: |
          python - <<'PY'
          import importlib.util
          required = ["google.genai", "matplotlib", "pandas", "numpy"]
          missing = [name for name in required if importlib.util.find_spec(name) is None]
          if missing:
              raise SystemExit("Missing production dependencies: " + ", ".join(missing))
          print("All production dependencies OK")
          PY
      - name: Benchmark successful public Square creators
        run: python src/creator_benchmark.py || true
      - name: Run full creator intelligence phases
        run: python src/run_creator_intelligence.py
      - name: Run market and editorial preflight
        env:
          TOPIC: ${{ inputs.topic }}
        run: |
          python src/editorial_preflight.py
          if [ -n "$TOPIC" ]; then
            python -c "import json; from pathlib import Path; p=Path('data/live/editorial_preflight.json'); d=json.loads(p.read_text()); d['run_ai']=True; d['reason']='manual_topic'; p.write_text(json.dumps(d,indent=2))"
          fi
      - name: Select engagement experiment
        run: python src/engagement_engine.py
      - name: Run Creator Brain
        run: |
          python src/creator_brain.py
          python src/creator_brain_gate.py
          python src/pipeline_stage.py creator_brain success "Creator Brain decision wired into this production cycle"
      - name: Run AI creator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          GEMINI_DAILY_BUDGET: "20"
          TOPIC: ${{ inputs.topic }}
        run: |
          RUN_AI=$(python -c "import json; print(str(json.load(open('data/live/editorial_preflight.json')).get('run_ai',False)).lower())")
          if [ "$RUN_AI" != "true" ]; then
            echo '{"status":"NO_OPPORTUNITY"}' > data/live/creator_status.json
            python src/pipeline_stage.py ai_draft blocked "No real opportunity passed preflight"
            exit 0
          fi
          python src/safe_creator_runner.py
          python src/pipeline_stage.py ai_draft success "Fresh draft generated"
      - name: Render visual
        run: |
          STATUS=$(python -c "import json; print(json.load(open('data/live/creator_status.json')).get('status',''))")
          if [ "$STATUS" != "AI_SUCCESS" ] && [ "$STATUS" != "LOCAL_FALLBACK_SUCCESS" ]; then
            python src/pipeline_stage.py visual blocked "No fresh draft"
            exit 0
          fi
          if python src/visual_renderer.py; then
            python src/pipeline_stage.py visual success "Visual rendering completed"
          else
            python -m pip install --no-cache-dir "matplotlib>=3.8.0" "pandas>=2.0.0" "numpy>=1.26.0"
            if python src/visual_renderer.py; then
              python src/pipeline_stage.py visual success "Visual rendering recovered"
            else
              python - <<'PY'
          import json
          from pathlib import Path
          reports=sorted(Path('data/reports').glob('*-multi-agent.json'),key=lambda p:p.stat().st_mtime,reverse=True)
          if not reports: raise SystemExit('No draft available')
          p=reports[0]; d=json.loads(p.read_text()); d.setdefault('visual_plan',{}).update(use_visual=False,type='none',degraded_from_visual=True); p.write_text(json.dumps(d,indent=2))
          PY
              python src/pipeline_stage.py visual success "Degraded safely to text"
            fi
          fi
      - name: Evaluate publication gate and rescue once if needed
        id: gate
        run: |
          python src/workflow_helpers.py gate
          PUBLISH=$(grep -E '^publish=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)
          if [ "$PUBLISH" != "true" ]; then
            echo "Publication gate rejected the first draft. Building a deterministic publish rescue from verified market data."
            python src/publish_rescue.py
            python src/workflow_helpers.py gate
            PUBLISH=$(grep -E '^publish=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)
          fi
          if [ "$PUBLISH" = "true" ]; then
            python src/pipeline_stage.py quality_gate success "Publication gate passed or rescue succeeded"
          else
            python src/pipeline_stage.py quality_gate blocked "Publication gate and deterministic rescue both rejected the cycle"
            cat /tmp/publish_gate.json || true
            cat data/live/engagement_gate.json || true
            exit 1
          fi
      - name: Locate fresh draft
        if: ${{ steps.gate.outputs.publish == 'true' }}
        id: draft
        run: |
          DRAFT=$(find data/reports -type f -name '*-multi-agent.json' -mmin -20 -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)
          test -n "$DRAFT"
          echo "path=$DRAFT" >> "$GITHUB_OUTPUT"
      - name: Extract post text
        if: ${{ steps.gate.outputs.publish == 'true' }}
        env:
          DRAFT_PATH: ${{ steps.draft.outputs.path }}
        run: python src/workflow_helpers.py extract
      - name: Setup Node
        if: ${{ steps.gate.outputs.publish == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download official Binance Square skill
        if: ${{ steps.gate.outputs.publish == 'true' }}
        run: git clone --depth 1 https://github.com/binance/binance-skills-hub.git binance-skills-hub
      - name: Publish image post
        if: ${{ steps.gate.outputs.publish == 'true' && steps.gate.outputs.mode == 'image' }}
        env:
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
        run: |
          python src/pipeline_stage.py publish running "Publishing image to Binance Square"
          node binance-skills-hub/skills/binance/square-post/scripts/post-image.mjs --images data/live/visual.png --text "$(cat data/live/publish_text.txt)" 2>&1 | tee /tmp/publish-result.txt
          grep -q '^ID:' /tmp/publish-result.txt
          python src/pipeline_stage.py publish success "Binance publisher returned a post result"
          python src/pipeline_stage.py verify-publish
      - name: Publish text post
        if: ${{ steps.gate.outputs.publish == 'true' && steps.gate.outputs.mode == 'text' }}
        env:
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
        run: |
          python src/pipeline_stage.py publish running "Publishing text to Binance Square"
          node binance-skills-hub/skills/binance/square-post/scripts/post-text.mjs --text "$(cat data/live/publish_text.txt)" 2>&1 | tee /tmp/publish-result.txt
          grep -q '^ID:' /tmp/publish-result.txt
          python src/pipeline_stage.py publish success "Binance publisher returned a post result"
          python src/pipeline_stage.py verify-publish
      - name: Record publication
        if: ${{ steps.gate.outputs.publish == 'true' }}
        env:
          DRAFT_PATH: ${{ steps.draft.outputs.path }}
          MODE: ${{ steps.gate.outputs.mode }}
        run: python src/workflow_helpers.py record
      - name: Finalize
        if: always()
        run: python src/pipeline_stage.py finalize "Production cycle completed"
      - name: Persist state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics data/live data/intelligence
          git diff --cached --quiet || git commit -m "Record autonomous creator cycle"
          git pull --rebase --autostash origin main
          git push origin main || true
