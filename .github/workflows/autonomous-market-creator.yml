          run_component run_creator_intelligence python src/run_creator_intelligence.py
          run_component editorial_preflight python src/editorial_preflight.py

          echo "===== INTELLIGENCE SUMMARY ====="
          cat data/live/intelligence_diagnostics/summary.txt

          if [ "$failures" -ne 0 ]; then
            echo "Intelligence refresh failed in $failures component(s). Publication remains blocked; inspect data/live/intelligence_diagnostics/*.log."
            exit 1
          fi

      - name: Preserve intelligence diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: intelligence-diagnostics-${{ github.run_id }}
          path: data/live/intelligence_diagnostics/
          if-no-files-found: warn
          retention-days: 14

      - name: NIC 22.2 early opportunity gate
        id: early_opportunity
        run: |
          set +e
          python src/nic22_2_early_opportunity_engine.py
          eligible=$(python -c 'import json; print(str(json.load(open("data/live/nic22_2_early_selection.json")).get("status") == "SELECTED").lower())')
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"
          if [ "$eligible" != "true" ]; then
            echo "No EARLY/DEVELOPING setup passed the extension and participation gate; publication will stop safely."
          fi
          exit 0

      - name: NIC 22.3 early signal confirmation
        id: early_confirmation
        if: ${{ steps.early_opportunity.outputs.eligible == 'true' }}
        run: |
          set +e
          python src/nic22_3_early_confirmation_engine.py
          confirmed=$(python -c 'import json; print(str(json.load(open("data/live/nic22_3_confirmation_selection.json")).get("status") == "CONFIRMED").lower())')
          echo "confirmed=$confirmed" >> "$GITHUB_OUTPUT"
          if [ "$confirmed" != "true" ]; then
            echo "No early setup has enough independent confirmation; publication will stop safely."
          fi
          exit 0

      - name: NIC 22.3.2 developing setup monitor
        if: ${{ steps.early_opportunity.outputs.eligible == 'true' }}
        run: |
          python src/nic22_3_2_developing_setup_monitor.py
          python -m json.tool data/live/nic22_3_developing_watch.json >/dev/null
          python -m json.tool data/live/nic22_3_developing_history.json >/dev/null

      - name: Preserve developing setup telemetry
        if: ${{ always() && steps.early_opportunity.outputs.eligible == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: nic22-3-developing-telemetry-${{ github.run_id }}
          path: |
            data/live/nic22_3_early_confirmation.json
            data/live/nic22_3_developing_watch.json
            data/live/nic22_3_developing_history.json
          if-no-files-found: warn
          retention-days: 30

      - name: NIC 22.1 opportunity rotation
        if: ${{ steps.early_confirmation.outputs.confirmed == 'true' }}
        run: |
          python src/nic22_opportunity_diversity_engine.py
          test -s data/live/nic22_opportunity_selection.json
          python -m json.tool data/live/nic22_opportunity_selection.json >/dev/null

      - name: Measure previous publications and learning state
        if: ${{ steps.early_confirmation.outputs.confirmed == 'true' }}
        run: |
          python src/square_performance_collector.py
          python src/square_post_detail_collector.py
          python src/nic_outcome_learner.py
          python src/nic_strategy_calibrator.py
          python src/learning_engine.py || true
          python src/nic_transparency_journal.py || true