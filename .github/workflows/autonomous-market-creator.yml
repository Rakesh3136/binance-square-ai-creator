name: Autonomous Market Creator

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional topic; leave blank to let the AI choose the strongest live market opportunity"
        required: false
        default: ""
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: autonomous-market-creator
  cancel-in-progress: true

jobs:
  create-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install creator dependencies
        run: pip install --disable-pip-version-check "google-genai>=1.0.0" matplotlib

      - name: Scan live Binance market
        run: python src/live_market_scanner.py

      - name: Scan crypto news feeds
        run: python src/news_scanner.py

      - name: Run autonomous multi-agent creator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          TOPIC: ${{ inputs.topic }}
        run: python src/multi_agent_creator.py

      - name: Render visual when requested
        run: python src/visual_renderer.py

      - name: Save market, news, draft and visuals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live/ data/reports/ data/visuals/
          git diff --cached --quiet && exit 0
          git commit -m "Add autonomous research draft and visual"
          git push

      - name: Set up Node.js for publishing
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download official Binance Square skill
        run: git clone --depth 1 https://github.com/binance/binance-skills-hub.git binance-skills-hub

      - name: Evaluate autonomous publishing gate
        id: gate
        shell: bash
        run: |
          DRAFT=$(find data/reports -type f -name '*multi-agent.json' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)
          if [ -z "$DRAFT" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "No draft found; skipping publish."
            exit 0
          fi

          export DRAFT
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          draft_path = Path(os.environ["DRAFT"])
          data = json.loads(draft_path.read_text(encoding="utf-8"))
          research = data.get("research") or {}
          critique = data.get("critique") or {}
          draft = data.get("draft") or {}
          visual = data.get("visual_plan") or {}

          quality = float(draft.get("quality_score") or 0)
          opportunity = max(
              float(research.get("opportunity_score") or 0),
              float(critique.get("revised_opportunity_score") or 0),
          )
          use_visual = bool(visual.get("use_visual"))

          # Strong editorial gate: this is a content-quality rule, not an earnings guarantee.
          publish = quality >= 85 and opportunity >= 80 and data.get("status") == "DRAFT_ONLY_NOT_PUBLISHED"

          Path("/tmp/publish_gate.json").write_text(json.dumps({
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "draft": str(draft_path),
              "quality_score": quality,
              "opportunity_score": opportunity,
              "use_visual": use_visual,
              "publish": publish,
          }, indent=2), encoding="utf-8")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"publish={'true' if publish else 'false'}\n")
              out.write(f"mode={'image' if use_visual else 'text'}\n")

          print(json.dumps({
              "publish": publish,
              "mode": "image" if use_visual else "text",
              "quality_score": quality,
              "opportunity_score": opportunity,
          }, indent=2))
          PY

      - name: Locate latest draft for publishing
        if: ${{ steps.gate.outputs.publish == 'true' }}
        id: draft
        shell: bash
        run: |
          DRAFT=$(find data/reports -type f -name '*multi-agent.json' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)
          test -n "$DRAFT" || (echo "No draft found" >&2; exit 1)
          echo "path=$DRAFT" >> "$GITHUB_OUTPUT"

      - name: Extract publishable post
        if: ${{ steps.gate.outputs.publish == 'true' }}
        env:
          DRAFT_PATH: ${{ steps.draft.outputs.path }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path(os.environ['DRAFT_PATH']).read_text(encoding='utf-8'))
          post = ((data.get('draft') or {}).get('post') or '').strip()
          if not post:
              raise SystemExit('Draft has no publishable post text')
          Path('/tmp/square-post.txt').write_text(post, encoding='utf-8')
          PY

      - name: Publish text post autonomously
        if: ${{ steps.gate.outputs.publish == 'true' && steps.gate.outputs.mode == 'text' }}
        env:
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
        run: |
          node binance-skills-hub/skills/binance/square-post/scripts/post-text.mjs --text "$(cat /tmp/square-post.txt)" | tee /tmp/publish-result.txt

      - name: Publish image post autonomously
        if: ${{ steps.gate.outputs.publish == 'true' && steps.gate.outputs.mode == 'image' }}
        env:
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
        run: |
          IMAGE=$(find data/visuals -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' \) -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -1 | cut -d' ' -f2-)
          if [ -z "$IMAGE" ]; then
            echo "Visual requested but no image exists; refusing to publish." >&2
            exit 1
          fi
          node binance-skills-hub/skills/binance/square-post/scripts/post-image.mjs --text "$(cat /tmp/square-post.txt)" --images "$IMAGE" | tee /tmp/publish-result.txt

      - name: Save publication record
        if: ${{ steps.gate.outputs.publish == 'true' && success() }}
        run: |
          mkdir -p analytics
          python - <<'PY'
          import json
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          result = Path('/tmp/publish-result.txt').read_text(encoding='utf-8') if Path('/tmp/publish-result.txt').exists() else ''
          match = re.search(r'ID:\s*(\S+)', result)
          link = None
          for line in result.splitlines():
              if line.startswith('Link:'):
                  link = line.split('Link:', 1)[1].strip()
                  break

          record = {
              'published_at': datetime.now(timezone.utc).isoformat(),
              'post_id': match.group(1) if match else None,
              'link': link,
              'mode': 'image' if '${{ steps.gate.outputs.mode }}' == 'image' else 'text',
              'status': 'PUBLISHED_AUTONOMOUSLY',
          }
          path = Path('analytics/publication_log.jsonl')
          with path.open('a', encoding='utf-8') as f:
              f.write(json.dumps(record, ensure_ascii=False) + '\n')
          print(json.dumps(record, indent=2))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics/publication_log.jsonl
          git diff --cached --quiet && exit 0
          git commit -m "Log autonomous Square publication"
          git push
