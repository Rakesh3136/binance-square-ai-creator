name: Binance Square AI Creator

on:
  schedule:
    - cron: '7 */3 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: Optional topic; leave blank for autonomous selection
        required: false
        default: ''
        type: string

env:
  PYTHONUNBUFFERED: '1'

concurrency:
  group: autonomous-market-creator
  cancel-in-progress: false

jobs:
  create-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt

      - name: Reset production cycle
        run: python src/pipeline_stage.py reset 'Fresh autonomous production cycle'

      - name: Refresh live market
        run: python src/live_market_scanner.py

      - name: Run creator intelligence
        run: python src/run_creator_intelligence.py

      - name: Run editorial preflight
        env:
          TOPIC: ${{ github.event.inputs.topic || '' }}
        run: |
          python src/editorial_preflight.py
          if [ -n "$TOPIC" ]; then
            python src/workflow_helpers.py manual-topic
          fi

      - name: Run growth and engagement intelligence
        run: |
          python src/signal_outcome_tracker.py
          python src/engagement_engine.py
          python src/freeze_opportunity.py
          python src/performance_feedback.py
          python src/creator_growth_system.py
          python src/living_brain.py

      - name: Run Creator Brain
        run: |
          python src/creator_brain.py
          python src/creator_brain_gate.py
          python src/pipeline_stage.py creator_brain success 'Creator Brain decision completed'

      - name: Prepare publication context
        run: |
          python src/publication_context.py
          python src/self_repair_agent.py
          python src/editorial_prompt_patch.py
          python -m compileall -q src

      - name: Create AI draft
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          GEMINI_DAILY_BUDGET: '20'
          TOPIC: ${{ github.event.inputs.topic || '' }}
        run: |
          python src/safe_creator_runner.py
          python src/normalize_draft.py
          python src/technical_enricher.py
          python src/call_tracker.py

      - name: Improve draft with Creator Intelligence
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          GEMINI_DAILY_BUDGET: '20'
          TOPIC: ${{ github.event.inputs.topic || '' }}
        run: |
          set +e
          python src/creator_intelligence_2.py
          rc=$?
          if [ "$rc" = '3' ]; then
            python src/creator_rework.py
          fi
          exit 0

      - name: Setup Node and Playwright
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Render TradingView chart
        run: |
          python src/visual_renderer.py
          test -s data/live/visual.png
          python src/pipeline_stage.py visual success 'TradingView chart rendered'

      - name: Validate TradingView chart
        run: |
          python src/validate_visual.py
          python src/validate_tradingview_visual.py data/live/visual.png
          python src/pipeline_stage.py visual_symbol success 'TradingView symbol matches the post'
          python src/pipeline_stage.py visual_content success 'TradingView image passed visual validation'

      - name: Locate fresh draft
        id: draft
        run: |
          draft=$(find data/reports -type f -name '*-multi-agent.json' -mmin -30 -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)
          if [ -z "$draft" ]; then
            echo '::error::No fresh AI draft found'
            exit 1
          fi
          echo "path=$draft" >> "$GITHUB_OUTPUT"

      - name: Apply human editorial layer
        env:
          DRAFT_PATH: ${{ steps.draft.outputs.path }}
        run: |
          python src/human_editor.py
          python -m json.tool "$DRAFT_PATH" >/dev/null

      - name: Run publication gate
        id: gate
        run: |
          set +e
          python src/production_manager.py
          rc=$?
          set -e
          if [ ! -f /tmp/publish_gate.json ]; then
            echo '::error::Production Manager did not create /tmp/publish_gate.json'
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo 'mode=image' >> "$GITHUB_OUTPUT"
            exit "$rc"
          fi
          python -c 'import json; print(json.dumps(json.load(open("/tmp/publish_gate.json")), indent=2))'
          publish=$(python -c 'import json; print(str(json.load(open("/tmp/publish_gate.json")).get("publish", False)).lower())')
          mode=$(python -c 'import json; print(json.load(open("/tmp/publish_gate.json")).get("mode", "image"))')
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          if [ "$publish" = 'true' ]; then
            python src/pipeline_stage.py quality_gate success 'Publication authorized'
          else
            python src/pipeline_stage.py quality_gate blocked 'Publication blocked by quality gate'
          fi
          exit 0

      - name: Extract publication text
        if: ${{ steps.gate.outputs.publish == 'true' }}
        env:
          DRAFT_PATH: ${{ steps.draft.outputs.path }}
        run: python src/workflow_helpers.py extract

      - name: Final image validation
        if: ${{ steps.gate.outputs.publish == 'true' && steps.gate.outputs.mode == 'image' }}
        run: |
          python src/validate_visual.py
          python src/validate_tradingview_visual.py data/live/visual.png

      - name: Download Binance Square publisher
        if: ${{ steps.gate.outputs.publish == 'true' && steps.gate.outputs.mode == 'image' }}
        run: git clone --depth 1 https://github.com/binance/binance-skills-hub.git binance-skills-hub

      - name: Publish to Binance Square
        if: ${{ steps.gate.outputs.publish == 'true' && steps.gate.outputs.mode == 'image' }}
        env:
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
        run: |
          python src/pipeline_stage.py publish running 'Publishing validated TradingView image'
          node binance-skills-hub/skills/binance/square-post/scripts/post-image.mjs --images data/live/visual.png --text "$(cat data/live/publish_text.txt)" 2>&1 | tee /tmp/publish-result.txt
          grep -q '^ID:' /tmp/publish-result.txt
          python src/pipeline_stage.py publish success 'Binance Square returned a post ID'
          python src/pipeline_stage.py verify-publish

      - name: Record publication
        if: ${{ steps.gate.outputs.publish == 'true' }}
        env:
          DRAFT_PATH: ${{ steps.draft.outputs.path }}
          MODE: ${{ steps.gate.outputs.mode }}
        run: python src/workflow_helpers.py record

      - name: Diagnostics
        if: always()
        run: |
          echo '=== PIPELINE STATUS ==='
          test -f data/live/pipeline_status.json && cat data/live/pipeline_status.json || true
          echo '=== PUBLICATION GATE ==='
          test -f /tmp/publish_gate.json && cat /tmp/publish_gate.json || true
          echo '=== CREATOR STATUS ==='
          test -f data/live/creator_status.json && cat data/live/creator_status.json || true
          echo '=== VISUAL METADATA ==='
          test -f data/live/visual_metadata.json && cat data/live/visual_metadata.json || true
          echo '=== EDITORIAL POLISH ==='
          test -f data/live/editorial_polish.json && cat data/live/editorial_polish.json || true

      - name: Persist learning state
        if: always()
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+users.noreply.github.com'
          git add analytics data/live data/intelligence
          git diff --cached --quiet || git commit -m 'Record autonomous creator cycle'
          git push origin HEAD:main || true

      - name: Finalize
        if: always()
        run: |
          if [ '${{ steps.gate.outputs.publish }}' = 'true' ]; then
            python src/pipeline_stage.py finalize success 'Production cycle completed and publication verified'
          else
            python src/pipeline_stage.py finalize blocked 'Production cycle ended without a verified Binance Square publication'
            exit 1
          fi
