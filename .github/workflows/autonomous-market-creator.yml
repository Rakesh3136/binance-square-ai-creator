name: Binance Square AI Creator — Single Autonomous Orchestrator
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
permissions:
  contents: write
jobs:
  creator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and refine publishable content
        run: |
          python src/safe_creator_runner.py
          python src/normalize_draft.py
          python src/technical_enricher.py
          python -m py_compile src/nic_pattern_visual_engine_18.py
          python tests/test_nic_pattern_visual_engine_18.py
          python src/nic_pattern_visual_engine_18.py
          python -m json.tool data/live/nic_pattern_visual_engine_18.json >/dev/null
