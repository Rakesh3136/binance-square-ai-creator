name: NIC Verified Square Reward Evidence PR Checks

on:
  pull_request:
    paths:
      - 'src/nic_reward_evidence.py'
      - 'src/nic_revenue_pattern_lab.py'
      - 'src/revenue_content_director.py'
      - 'tests/test_nic_reward_evidence.py'
      - '.github/workflows/nic-reward-evidence-pr.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reward-evidence-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile reward evidence consumers
        run: python -m py_compile src/nic_reward_evidence.py src/nic_revenue_pattern_lab.py src/revenue_content_director.py
      - name: Run reward evidence regression tests
        run: python -m unittest discover -s tests -p 'test_nic_reward_evidence.py' -v
      - name: Verify policy-gated editorial publishing
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          workflow = Path(".github/workflows/autonomous-market-creator.yml").read_text(encoding="utf-8")
          policy = json.loads(Path("nic_publication_policy.json").read_text(encoding="utf-8"))
          assert "NIC editorial automatic-publication authorization" in workflow
          assert "id: publication_authorization" in workflow
          assert workflow.count("steps.publication_authorization.outputs.authorized == 'true'") >= 2, "Payload construction and publishing must both require explicit authorization"
          assert "NIC_AUTO_PUBLICATION_MODE: EDITORIAL_ONLY" in workflow
          assert policy.get("editorial_auto_publication_enabled") is True
          assert policy.get("editorial_mode") == "EDITORIAL_ONLY"
          assert policy.get("trade_signal_publication_enabled") is False
          assert policy.get("live_orders_enabled") is False
          assert "NIC 21 and editorial revalidation" in workflow
          print("Editorial publishing is explicitly authorized and gated; trade signals and live orders remain disabled.")
          PY
      - name: Check whitespace
        run: git diff --check
