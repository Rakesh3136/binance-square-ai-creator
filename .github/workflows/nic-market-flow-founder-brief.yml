name: NIC — Market Flow and Founder Brief

on:
  pull_request:
    paths:
      - "src/nic_market_flow_founder_intelligence.py"
      - "tests/test_nic_market_flow_founder_intelligence.py"
      - ".github/workflows/nic-market-flow-founder-brief.yml"
  workflow_run:
    workflows: ["Binance Square AI Creator — Single Autonomous Orchestrator"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nic-market-flow-founder-brief
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and test flow/founder brief
        run: |
          python -m py_compile src/nic_market_flow_founder_intelligence.py
          python -m unittest discover -s tests -p "test_nic_market_flow_founder_intelligence.py" -v

  refresh-brief:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build freshness-gated report
        run: |
          set -euo pipefail
          python -m py_compile src/nic_market_flow_founder_intelligence.py
          python src/nic_market_flow_founder_intelligence.py
          python -m json.tool data/live/nic_market_flow_founder_brief.json >/dev/null
      - name: Persist report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live/nic_market_flow_founder_brief.json
          if git diff --cached --quiet; then
            echo "Market-flow/founder brief unchanged."
            exit 0
          fi
          git commit -m "Refresh NIC market flow and founder brief"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
