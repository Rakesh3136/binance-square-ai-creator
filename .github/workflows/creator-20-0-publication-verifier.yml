name: Creator 20.0 Publication Truth & Operations

on:
  schedule:
    - cron: '19 */3 * * *'
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: '1'

concurrency:
  group: main-branch-writer
  cancel-in-progress: false

jobs:
  verify-publication-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify publication truth
        run: python src/creator_20_0_publication_verifier.py
      - name: Validate generated state
        run: |
          python -m json.tool data/live/creator_20_0_publication_truth.json >/dev/null
          python -m json.tool data/intelligence/creator_20_0_report.json >/dev/null
          python -m json.tool analytics/creator_20_0_memory.json >/dev/null
      - name: Persist state
        run: |
          git config user.name 'binance-square-ai-creator'
          git config user.email 'actions@users.noreply.github.com'
          git add data/live/creator_20_0_publication_truth.json data/intelligence/creator_20_0_report.json analytics/creator_20_0_memory.json
          git diff --cached --quiet || git commit -m 'Persist Creator 20.0 publication truth'
          git push
