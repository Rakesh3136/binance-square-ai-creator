name: Creator 7.5 Growth Portfolio

on:
  schedule:
    - cron: '7 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-branch-writer
  cancel-in-progress: false

jobs:
  portfolio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build growth portfolio
        run: python src/creator_7_5_growth_portfolio.py
      - name: Save growth strategy
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analytics/creator_7_5_growth_portfolio.json analytics/strategy_memory.json data/intelligence/creator_7_5_report.json
          git diff --cached --quiet && exit 0
          git pull --rebase --autostash origin main
          git add analytics/creator_7_5_growth_portfolio.json analytics/strategy_memory.json data/intelligence/creator_7_5_report.json
          git diff --cached --quiet && exit 0
          git commit -m 'Build Creator 7.5 growth portfolio'
          git push origin main
