name: Creator 16.0 Counterfactual Decision Engine

on:
  schedule:
    - cron: '59 */3 * * *'
  workflow_dispatch:

concurrency:
  group: main-branch-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  counterfactual:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and run counterfactual engine
        run: |
          python -m compileall -q src/creator_16_0_counterfactual_engine.py
          python src/creator_16_0_counterfactual_engine.py
          test -s data/live/creator_16_0_decision_board.json
          test -s data/intelligence/creator_16_0_report.json
          test -s analytics/creator_16_0_decision_memory.json
      - name: Persist decision state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/live/creator_16_0_decision_board.json data/intelligence/creator_16_0_report.json analytics/creator_16_0_decision_memory.json
          git diff --cached --quiet && exit 0
          git pull --rebase --autostash origin main
          git add data/live/creator_16_0_decision_board.json data/intelligence/creator_16_0_report.json analytics/creator_16_0_decision_memory.json
          git diff --cached --quiet && exit 0
          git commit -m 'Run Creator 16.0 counterfactual decision engine'
          git push origin main
