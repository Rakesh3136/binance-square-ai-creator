name: NIC OS Persistent Task Runtime Tests

on:
  pull_request:
    paths:
      - "src/nic_os_task_runtime.py"
      - "tests/test_nic_os_task_runtime.py"
      - ".github/workflows/nic-os-task-runtime-tests.yml"
  push:
    branches:
      - "feat/nic-persistent-task-runtime"
    paths:
      - "src/nic_os_task_runtime.py"
      - "tests/test_nic_os_task_runtime.py"
      - ".github/workflows/nic-os-task-runtime-tests.yml"

permissions:
  contents: read

jobs:
  persistent-task-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Test persistent task queue and audit history
        run: python -m pytest -q tests/test_nic_os_task_runtime.py
