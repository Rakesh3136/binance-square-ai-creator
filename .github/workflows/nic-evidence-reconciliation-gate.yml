name: NIC Evidence Reconciliation Gate
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/nic_evidence_reconciliation_gate.py"
      - "tests/test_nic_evidence_reconciliation_gate.py"
      - "data/intelligence/nic_forecast_truth_ledger.jsonl"
      - "data/intelligence/nic_forecast_outcome_events.jsonl"
      - "data/intelligence/nic_forecast_laboratory_report.json"
      - "data/intelligence/nic_forecast_profitability.json"
      - "data/intelligence/nic_portfolio_reality.json"
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test fail-closed behavior
        run: python tests/test_nic_evidence_reconciliation_gate.py
      - name: Validate persisted source evidence
        run: python src/nic_evidence_reconciliation_gate.py
