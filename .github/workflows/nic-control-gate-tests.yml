name: NIC Control Gate Safety Tests

on:
  pull_request:
    paths:
      - 'src/nic_control_gate.py'
      - 'tests/test_nic_control_gate.py'
      - '.github/workflows/nic-control-gate-tests.yml'
  push:
    branches: [main]
    paths:
      - 'src/nic_control_gate.py'
      - 'tests/test_nic_control_gate.py'
      - '.github/workflows/nic-control-gate-tests.yml'

permissions:
  contents: read

jobs:
  control-gate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile safety gate
        run: python -m py_compile src/nic_control_gate.py
      - name: Verify approval and emergency-stop invariants
        run: python -m pytest -q tests/test_nic_control_gate.py
