name: NIC Historical Creator Cohort Learning

on:
  pull_request:
    paths:
      - "src/nic_square_profile_research.py"
      - "src/nic_creator_period_learning.py"
      - "src/test_historical_window_cursor.py"
      - ".github/workflows/nic-historical-cohort-learning.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-cohort-learning:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile research and cohort learner
        run: python -m py_compile src/nic_square_profile_research.py src/nic_creator_period_learning.py src/test_historical_window_cursor.py
      - name: Test historical reward-period cursor
        run: python -m unittest src.test_historical_window_cursor -v
