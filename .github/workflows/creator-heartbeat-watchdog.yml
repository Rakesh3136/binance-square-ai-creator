name: Binance Square Creator — Heartbeat Watchdog

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: creator-heartbeat-watchdog
  cancel-in-progress: true

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ensure autonomous creator keeps waking
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          workflow='autonomous-market-creator.yml'
          now=$(date -u +%s)

          # Inspect several recent runs so a stale queued run cannot hide a stalled creator.
          runs=$(gh run list \
            --repo "$GH_REPO" \
            --workflow "$workflow" \
            --branch main \
            --limit 10 \
            --json status,createdAt,updatedAt,databaseId,event)

          if [ "$(printf '%s' "$runs" | jq 'length')" -eq 0 ]; then
            echo 'No creator run exists; dispatching the initial recovery run.'
            gh workflow run "$workflow" --repo "$GH_REPO" --ref main
            exit 0
          fi

          active_count=$(printf '%s' "$runs" | jq '[.[] | select(.status == "in_progress")] | length')
          if [ "$active_count" -gt 0 ]; then
            echo "Creator is already in progress ($active_count active run); no recovery dispatch needed."
            exit 0
          fi

          latest=$(printf '%s' "$runs" | jq '.[0]')
          latest_id=$(printf '%s' "$latest" | jq -r '.databaseId')
          latest_status=$(printf '%s' "$latest" | jq -r '.status')
          latest_created=$(printf '%s' "$latest" | jq -r '.createdAt')
          latest_created_epoch=$(date -d "$latest_created" +%s)
          latest_age=$((now-latest_created_epoch))

          echo "Latest creator run: id=$latest_id status=$latest_status created=$latest_created age=${latest_age}s"

          if [ "$latest_status" = 'queued' ] && [ "$latest_age" -lt 1800 ]; then
            echo 'Creator has a recent queued run; no recovery dispatch needed.'
            exit 0
          fi

          if [ "$latest_status" = 'queued' ] && [ "$latest_age" -ge 1800 ]; then
            echo 'Creator queue entry is stale (>30m) with no active run; cancelling it.'
            gh run cancel "$latest_id" --repo "$GH_REPO" || true
            echo 'Dispatching recovery run after stale queue cleanup.'
            gh workflow run "$workflow" --repo "$GH_REPO" --ref main
            exit 0
          fi

          if [ "$latest_age" -ge 1800 ]; then
            echo 'Creator has not started a fresh run for 30 minutes; dispatching recovery run.'
            gh workflow run "$workflow" --repo "$GH_REPO" --ref main
          else
            echo 'Recent creator run exists; no recovery dispatch needed.'
          fi
