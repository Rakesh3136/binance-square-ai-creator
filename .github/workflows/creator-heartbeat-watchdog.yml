name: Binance Square Creator — Heartbeat Watchdog

on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: creator-heartbeat-watchdog
  cancel-in-progress: true

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ensure autonomous creator keeps waking
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          workflow='autonomous-market-creator.yml'
          runs=$(gh run list --workflow "$workflow" --branch main --limit 1 --json status,createdAt,databaseId --jq '.[0] // empty')
          now=$(date -u +%s)
          if [ -z "$runs" ]; then
            echo 'No creator run found; dispatching one.'
            gh workflow run "$workflow" --ref main
            exit 0
          fi
          status=$(printf '%s' "$runs" | jq -r '.status')
          created=$(printf '%s' "$runs" | jq -r '.createdAt')
          created_epoch=$(date -d "$created" +%s)
          age=$((now-created_epoch))
          echo "Latest creator run: $created (status=$status, age=${age}s)"
          if [ "$status" = 'queued' ] || [ "$status" = 'in_progress' ]; then
            echo 'Creator is already running; no dispatch needed.'
            exit 0
          fi
          if [ "$age" -ge 1500 ]; then
            echo 'Creator has not run recently; dispatching a heartbeat run.'
            gh workflow run "$workflow" --ref main
          else
            echo 'Recent creator run exists; no dispatch needed.'
          fi
