name: Signal-First Behavioral Verification

on:
  push:
    branches: [main]
    paths:
      - 'src/signal_first_router.py'
      - 'src/opportunity_timing_gate.py'
      - 'tests/test_opportunity_timing_gate.py'
      - 'src/binance_square_publisher.py'
      - 'src/freeze_opportunity.py'
      - 'tests/verify_signal_first_behavior.py'
      - 'tests/verify_publisher_asset_cooldown.py'
      - 'tests/verify_freeze_signal_recovery.py'
      - '.github/workflows/signal-first-behavioral-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax check
        run: python -m py_compile src/signal_first_router.py src/opportunity_timing_gate.py src/freeze_opportunity.py tests/verify_signal_first_behavior.py tests/verify_freeze_signal_recovery.py tests/test_opportunity_timing_gate.py

      - name: Verify Signal-First asset cooldown behavior
        run: python tests/verify_signal_first_behavior.py

      - name: Verify opportunity timing behavior
        run: python tests/test_opportunity_timing_gate.py

      - name: Verify final publisher asset cooldown behavior
        run: python tests/verify_publisher_asset_cooldown.py

      - name: Verify stale portfolio Signal-First recovery
        run: python tests/verify_freeze_signal_recovery.py

      - name: Verify final asset lock syntax
        run: python -m py_compile src/final_asset_lock.py src/binance_square_publisher.py

      - name: Verify router contains authoritative cooldown gate
        run: |
          grep -q "SIGNAL_FIRST_ASSET_COOLDOWN_HOURS" src/signal_first_router.py
          grep -q "same_asset_cooldown_requires_new_evidence_or_follow_up" src/signal_first_router.py
          grep -q "reason=blocked(x,rows)" src/signal_first_router.py
