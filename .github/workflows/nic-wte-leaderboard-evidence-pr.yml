name: NIC Write-to-Earn leaderboard evidence validation
on:
  pull_request:
    paths:
      - "src/nic_wte_leaderboard_evidence.py"
      - "src/nic_square_earnings_learning.py"
      - "tests/test_nic_wte_leaderboard_evidence.py"
      - "tests/test_nic_square_earnings_learning.py"
      - "data/intelligence/wte_leaderboard_observations.json"
      - ".github/workflows/nic-wte-leaderboard-evidence-pr.yml"
  push:
    branches: [main]
    paths:
      - "src/nic_wte_leaderboard_evidence.py"
      - "tests/test_nic_wte_leaderboard_evidence.py"
      - "data/intelligence/wte_leaderboard_observations.json"
      - ".github/workflows/nic-wte-leaderboard-evidence-pr.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile evidence ingester
        run: python -m py_compile src/nic_wte_leaderboard_evidence.py
      - name: Test leaderboard evidence validation and learning-plan integration
        run: python -m unittest tests.test_nic_wte_leaderboard_evidence tests.test_nic_square_earnings_learning -v
